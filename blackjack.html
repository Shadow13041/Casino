<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack - Shadow Casino</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d11; color: #ffffff; text-align: center; padding: 20px; margin: 0;
        }
        .main-header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;
            position: absolute; top: 0; left: 0; right: 0; z-index: 100; background: rgba(13, 13, 17, 0.9);
        }
        .nav-logo {
            color: #ff0055; text-shadow: 0 0 10px #ff0055; font-size: 1.6rem; font-weight: bold;
            cursor: pointer; text-decoration: none; margin: 0;
        }
        .profile-menu {
            color: #555566; font-size: 0.95rem; cursor: pointer; text-align: right; position: relative;
        }
        .profile-menu:hover { color: #888899; }
        .dropdown-content {
            display: none; background: #161622; border: 1px solid #333344; padding: 10px; border-radius: 10px;
            position: absolute; right: 0; top: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 120px; z-index: 200;
        }
        .dropdown-content a { color: #ff0055; text-decoration: none; display: block; margin: 5px 0; font-size: 0.85rem; }
        .game-container {
            background: #161622; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: inline-block; width: 95%; max-width: 460px; margin-top: 100px; text-align: center; box-sizing: border-box;
        }
        .card-area {
            background: #05050a; padding: 15px; border-radius: 15px; border: 2px solid #ff0055; margin: 15px 0; text-align: left;
        }
        .card-display { display: flex; gap: 8px; margin-top: 8px; min-height: 70px; flex-wrap: wrap; }
        .card-item {
            background: white; color: black; padding: 10px 14px; border-radius: 8px; font-size: 1.6rem;
            font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.3); min-width: 35px; text-align: center;
        }
        .card-red { color: #ff0055; }
        button {
            background: linear-gradient(135deg, #ff0055, #bc003f); color: white; border: none; padding: 12px 25px;
            font-size: 1rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 12px rgba(255, 0, 85, 0.3); margin: 5px;
        }
        button:disabled { background: #444; box-shadow: none; cursor: not-allowed; border-color: #444; }
        input {
            width: 60%; padding: 10px; margin: 10px 0; border-radius: 10px; border: 1px solid #333344;
            background: #05050a; color: white; text-align: center; font-size: 1rem; outline: none;
        }
        .status-text { font-size: 1.1rem; color: #ffcc00; font-weight: bold; margin-top: 15px; height: 25px; }
    </style>
</head>
<body>
    <div class="main-header">
        <div class="nav-logo" onclick="location.href='index.html'">SHADOW CASINO</div>
        <div class="profile-menu">
            <span onclick="toggleDropdown()" id="menu-username">Benutzer</span>
            <div id="profile-dropdown" class="dropdown-content">
                <a href="admin.html" id="admin-panel-link" style="display:none; font-weight:bold; color:#00ffcc;">⚙️ Admin Panel</a>
                <a href="index.html">🏠 Zentrale</a>
                <a href="#" onclick="logout()">Abmelden</a>
            </div>
        </div>
    </div>

    <div class="game-container">
        <h2 style="color:#ff0055; margin-top:0;">🃏 Shadow Blackjack</h2>
        <p style="color:#888; font-size:0.9rem; margin-bottom:5px;">Schlage die Karten des Dealers! Komm so nah wie möglich an die 21.</p>
        <div style="font-size: 0.95rem; color: #aaa; margin-bottom: 15px;">Kontostand: <span id="coins-display" style="color:#00ffcc; font-weight:bold;">0</span> $</div>
        
        <div id="setup-area">
            <input type="number" id="bet-input" placeholder="Einsatz in $" value="50"><br>
            <button onclick="startBlackjack()">Einsatz platzieren</button>
        </div>

        <div id="play-area" style="display: none;">
            <div class="card-area">
                <div style="font-size:0.85rem; color:#aaa;">Dealer-Hand (Punkte: <span id="dealer-score" style="color:#ff0055; font-weight:bold;">0</span>)</div>
                <div class="card-display" id="dealer-cards"></div>
            </div>
            <div class="card-area">
                <div style="font-size:0.85rem; color:#aaa;">Deine Hand (Punkte: <span id="player-score" style="color:#00ffcc; font-weight:bold;">0</span>)</div>
                <div class="card-display" id="player-cards"></div>
            </div>
            <center>
                <button id="hit-btn" onclick="playerHit()">➕ Karte fordern</button>
                <button id="stand-btn" onclick="playerStand()">✋ Halten</button>
            </center>
        </div>
        <div class="status-text" id="status-box">Platziere deinen Einsatz!</div>
    </div>
        <script>
        let bet = 0; let currentU = ""; let audioCtx = null;
        let deck = []; let playerHand = []; let dealerHand = []; let gameActive = false;

        function getAllUsers() { return JSON.parse(localStorage.getItem("sc_local_users") || "{}"); }
        function saveAllUsers(users) { localStorage.setItem("sc_local_users", JSON.stringify(users)); }

        function playSound(type) {
            try {
                if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'card') { osc.type = 'triangle'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05); osc.start(); osc.stop(audioCtx.currentTime + 0.05); } 
                else if (type === 'win') { osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); } 
                else if (type === 'lose') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, audioCtx.currentTime); gain.gain.setValueAtTime(0.12, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }
            } catch(e) {}
        }

        window.onload = function() {
            currentU = localStorage.getItem("sc_username"); if (!currentU) { location.href = "login.html"; return; }
            document.getElementById("menu-username").innerText = currentU;
            const currentRole = localStorage.getItem("sc_role");
            if (currentRole === "Owner" || currentRole === "Admin") { document.getElementById("admin-panel-link").style.display = "block"; }
            updateBalanceDisplay();
        };

        function updateBalanceDisplay() {
            let users = getAllUsers();
            document.getElementById("coins-display").innerText = users[currentU] ? users[currentU].balance : 1000;
        }

        function toggleDropdown() { const drop = document.getElementById("profile-dropdown"); drop.style.display = drop.style.display === "block" ? "none" : "block"; }
        function logout() { localStorage.clear(); location.href = "login.html"; }

        function createDeck() {
            const suits = ["♠", "♥", "♦", "♣"];
            const values = [
                { name: "2", val: 2 }, { name: "3", val: 3 }, { name: "4", val: 4 }, { name: "5", val: 5 },
                { name: "6", val: 6 }, { name: "7", val: 7 }, { name: "8", val: 8 }, { name: "9", val: 9 },
                { name: "10", val: 10 }, { name: "J", val: 10 }, { name: "Q", val: 10 }, { name: "K", val: 10 },
                { name: "A", val: 11 }
            ];
            deck = [];
            for (let suit of suits) {
                for (let v of values) {
                    deck.push({ suit: suit, name: v.name, value: v.val, isRed: (suit === "♥" || suit === "♦") });
                }
            }
            // Kartendeck mischen
            for (let i = deck.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function calculateScore(hand) {
            let score = 0; let aces = 0;
            for (let card of hand) {
                score += card.value;
                if (card.name === "A") aces++;
            }
            while (score > 21 && aces > 0) {
                score -= 10;
                aces--;
            }
            return score;
        }

        function renderCardHTML(containerId, hand, hideFirstCard = false) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";
            hand.forEach((card, idx) => {
                let cardDiv = document.createElement("div");
                cardDiv.className = "card-item" + (card.isRed && (!hideFirstCard || idx !== 0) ? " card-red" : "");
                if (hideFirstCard && idx === 0) {
                    cardDiv.innerText = "❓";
                    cardDiv.style.background = "#222";
                    cardDiv.style.color = "white";
                } else {
                    cardDiv.innerText = card.name + card.suit;
                }
                container.appendChild(cardDiv);
            });
        }

        function startBlackjack() {
            let users = getAllUsers();
            bet = parseInt(document.getElementById("bet-input").value);
            if (isNaN(bet) || bet <= 0 || bet > users[currentU].balance) { alert("Ungültiger Einsatz!"); return; }

            users[currentU].balance -= bet;
            saveAllUsers(users);
            updateBalanceDisplay();

            createDeck();
            playerHand = [deck.pop(), deck.pop()];
            dealerHand = [deck.pop(), deck.pop()];
            gameActive = true;

            document.getElementById("setup-area").style.display = "none";
            document.getElementById("play-area").style.display = "block";
            document.getElementById("hit-btn").disabled = false;
            document.getElementById("stand-btn").disabled = false;

            playSound('card');
            renderGame(true);

            let pScore = calculateScore(playerHand);
            if (pScore === 21) {
                playerStand();
            } else {
                document.getElementById("status-box").style.color = "#ffcc00";
                document.getElementById("status-box").innerText = "Du bist am Zug! Ziehen oder Halten?";
            }
        }

        function renderGame(hideDealer = true) {
            renderCardHTML("player-cards", playerHand);
            renderCardHTML("dealer-cards", dealerHand, hideDealer);

            document.getElementById("player-score").innerText = calculateScore(playerHand);
            if (hideDealer) {
                document.getElementById("dealer-score").innerText = dealerHand[1].value;
            } else {
                document.getElementById("dealer-score").innerText = calculateScore(dealerHand);
            }
        }

        function playerHit() {
            if (!gameActive) return;
            playerHand.push(deck.pop());
            playSound('card');
            
            let pScore = calculateScore(playerHand);
            renderGame(true);

            if (pScore > 21) {
                endGame('lose', "Überkauft! Du hast mehr als 21 Punkte. ❌");
            } else if (pScore === 21) {
                playerStand();
            }
        }

        function playerStand() {
            if (!gameActive) return;
            gameActive = false;
            document.getElementById("hit-btn").disabled = true;
            document.getElementById("stand-btn").disabled = true;

            let dScore = calculateScore(dealerHand);
            while (dScore < 17) {
                dealerHand.push(deck.pop());
                dScore = calculateScore(dealerHand);
                playSound('card');
            }

            renderGame(false);
            let pScore = calculateScore(playerHand);

            if (dScore > 21) {
                endGame('win', "Der Dealer hat sich überkauft! Du gewinnst! 🎉");
            } else if (pScore > dScore) {
                endGame('win', `Höhere Punktzahl! Du gewinnst mit ${pScore} gegen ${dScore}! 🏆`);
            } else if (pScore < dScore) {
                endGame('lose', `Der Dealer gewinnt mit ${dScore} gegen ${pScore}. ❌`);
            } else {
                endGame('push', `Unentschieden! Beide haben ${pScore} Punkte. 🤝`);
            }
        }

        function endGame(result, text) {
            gameActive = false;
            document.getElementById("hit-btn").disabled = true;
            document.getElementById("stand-btn").disabled = true;
            
            let users = getAllUsers();
            let statusBox = document.getElementById("status-box");
            statusBox.innerText = text;

            if (result === 'win') {
                let winAmt = bet * 2;
                // Blackjack-Bonus (21 mit genau 2 Karten zahlt 2.5-fach)
                if (playerHand.length === 2 && calculateScore(playerHand) === 21) {
                    winAmt = Math.floor(bet * 2.5);
                    statusBox.innerText = "💥 BLACKJACK! Du gewinnst den 2.5-fachen Einsatz! 🎉";
                }
                users[currentU].balance += winAmt;
                statusBox.style.color = "#00ffcc";
                playSound('win');
            } else if (result === 'push') {
                users[currentU].balance += bet;
                statusBox.style.color = "#ffcc00";
                playSound('card');
            } else {
                statusBox.style.color = "#ff0055";
                playSound('lose');
            }

            saveAllUsers(users);
            setTimeout(() => {
                updateBalanceDisplay();
                document.getElementById("setup-area").style.display = "block";
                document.getElementById("play-area").style.display = "none";
                statusBox.style.color = "#ffcc00";
                statusBox.innerText = "Platziere deinen Einsatz!";
            }, 4000);
        }
    </script>
</body>
</html>
