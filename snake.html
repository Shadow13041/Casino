<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Snake - Shadow Casino</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d11; color: #ffffff; text-align: center; padding: 15px; margin: 0;
        }
        .main-header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;
            position: absolute; top: 0; left: 0; right: 0; z-index: 100; background: rgba(13, 13, 17, 0.9);
        }
        .nav-logo {
            color: #ff0055; text-shadow: 0 0 10px #ff0055; font-size: 1.6rem; font-weight: bold;
            cursor: pointer; text-decoration: none; margin: 0;
        }
        .profile-menu {
            color: #555566; font-size: 0.95rem; cursor: pointer; text-align: right; position: relative;
        }
        .profile-menu:hover { color: #888899; }
              /* =============== START BLOCK 2 =============== */
        .dropdown-content {
            display: none; background: #161622; border: 1px solid #333344; padding: 10px; border-radius: 10px;
            position: absolute; right: 0; top: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 120px; z-index: 200;
        }
        .dropdown-content a { color: #ff0055; text-decoration: none; display: block; margin: 5px 0; font-size: 0.85rem; }
        .game-container {
            background: #161622; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: inline-block; width: 95%; max-width: 440px; margin-top: 85px; text-align: center; box-sizing: border-box;
        }
        /* Das 400x400 Pixel Retro-Spielfeld */
        canvas {
            background: #05050a; border: 3px solid #ff0055; display: block; margin: 15px auto;
            border-radius: 15px; box-shadow: inset 0 0 20px rgba(0,0,0,0.9); width: 100%; max-width: 340px; aspect-ratio: 1;
        }
        .controls-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 180px; margin: 15px auto;
        }
        button {
            background: linear-gradient(135deg, #ff0055, #bc003f); color: white; border: none; padding: 12px 20px;
            font-size: 1rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 12px rgba(255, 0, 85, 0.3);
        }
        button:disabled { background: #444; box-shadow: none; cursor: not-allowed; }
        .btn-ctrl { background: #1e1e2f; border: 2px solid #333344; font-size: 1.4rem; padding: 10px; border-radius: 12px; box-shadow: none; }
        .btn-ctrl:hover { border-color: #ff0055; }
        .cashout-btn { background: linear-gradient(135deg, #00ffcc, #00b38f); color: #0d0d11; box-shadow: none; width: 80%; }
        input {
            width: 70%; padding: 10px; margin: 6px 0; border-radius: 10px; border: 1px solid #333344;
            background: #05050a; color: white; text-align: center; font-size: 1rem;
        }
        .status-text { font-size: 1.1rem; color: #ffcc00; font-weight: bold; margin-top: 10px; height: 25px; }
    </style>
</head>
  <!-- =============== START BLOCK 3 =============== -->
<body>
    <div class="main-header">
        <div class="nav-logo" onclick="location.href='index.html'">SHADOW CASINO</div>
        <div class="profile-menu">
            <span onclick="toggleDropdown()" id="menu-username">Benutzer</span>
            <div id="profile-dropdown" class="dropdown-content">
                <a href="admin.html" id="admin-panel-link" style="display:none; font-weight:bold; color:#00ffcc;">⚙️ Admin Panel</a>
                <a href="index.html">🏠 Zentrale</a>
                <a href="#" onclick="logout()">Abmelden</a>
            </div>
        </div>
    </div>

    <div class="game-container">
        <h2 style="color:#ff0055; margin-top:0; font-size:1.6rem;">🐍 Casino Snake</h2>
        <p style="color:#888; font-size:0.85rem; margin-bottom:5px;">Friere Gewinne per Cashout ein, bevor du die Wand rammst!</p>
        <div style="font-size: 0.9rem; color: #aaa; margin-bottom: 10px;">Guthaben: <span id="coins-display" style="color:#00ffcc; font-weight:bold;">0</span> $</div>
        
        <div id="setup-area">
            <input type="number" id="bet-input" placeholder="Einsatz in $" value="50"><br>
            <button onclick="startSnake()">Spiel starten</button>
        </div>

        <div id="play-area" style="display: none;">
            <div style="font-size:0.9rem; color:#aaa;">Multiplikator: <span id="mult-display" style="color:#00ffcc; font-weight:bold;">1.00x</span> | Gewinn: <span id="potential-win" style="color:#00ffcc; font-weight:bold;">0</span> $</div>
            <canvas id="snakeCanvas" width="400" height="400"></canvas>
            
            <div class="controls-grid">
                <div></div><button class="btn-ctrl" onclick="changeDir(0, -1)">🔼</button><div></div>
                <button class="btn-ctrl" onclick="changeDir(-1, 0)">◀️</button><div></div><button class="btn-ctrl" onclick="changeDir(1, 0)">▶️</button>
                <div></div><button class="btn-ctrl" onclick="changeDir(0, 1)">🔽</button><div></div>
            </div>
            <button class="cashout-btn" onclick="cashoutSnake()">💵 Multiplikator sichern</button>
        </div>
        <div class="status-text" id="status-box">Platziere deine Casino-Wette!</div>
    </div>
  <!-- =============== START BLOCK 4 =============== -->
    <script>
        let bet = 0; let currentU = ""; let audioCtx = null;
        let canvas, ctx; let gameInterval; let gameActive = false;
        let snake = []; let food = { x: 0, y: 0 }; let gridCount = 20; let tileSize = 20;
        let dirX = 1; let dirY = 0; let nextDirX = 1; let nextDirY = 0;
        let collectedDiamonds = 0; let currentMultiplier = 1.0;
        const CLOUD_URL = "https://jsonbin.io";

        function playSound(type) {
            try {
                if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'eat') { osc.type = 'sine'; osc.frequency.setValueAtTime(500 + (collectedDiamonds * 40), audioCtx.currentTime); gain.gain.setValueAtTime(0.06, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); } 
                else if (type === 'crash') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.4); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4); osc.start(); osc.stop(audioCtx.currentTime + 0.4); }
                else if (type === 'cash') { osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); gain.gain.setValueAtTime(0.08, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25); osc.start(); osc.stop(audioCtx.currentTime + 0.25); }
            } catch(e) {}
        }

        window.onload = function() {
            currentU = localStorage.getItem("sc_username"); if (!currentU) { location.href = "login.html"; return; }
            document.getElementById("menu-username").innerText = currentU;
            const currentRole = localStorage.getItem("sc_role");
            if (currentRole === "Owner" || currentRole === "Admin") { document.getElementById("admin-panel-link").style.display = "block"; }
            updateBalanceDisplay();
            canvas = document.getElementById("snakeCanvas"); ctx = canvas.getContext("2d");
        };

        function updateBalanceDisplay() { document.getElementById("coins-display").innerText = localStorage.getItem("sc_balance_" + currentU) || 1000; }
        function toggleDropdown() { const drop = document.getElementById("profile-dropdown"); drop.style.display = drop.style.display === "block" ? "none" : "block"; }
        function logout() { localStorage.removeItem("sc_username"); localStorage.removeItem("sc_role"); localStorage.removeItem("sc_password"); location.href = "login.html"; }

        async function pushToCloud() {
            try {
                let userList = JSON.parse(localStorage.getItem("sc_global_users") || "[]");
                userList.forEach(u => { u.balance = parseInt(localStorage.getItem("sc_balance_" + u.username) || 1000); });
                await fetch(CLOUD_URL, { method: "PUT", headers: { "Content-Type": "application/json", "X-Master-Key": "$2b$10$ShadowCasinoSecretKey12345" }, body: JSON.stringify(userList) });
            } catch(e) {}
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * gridCount); food.y = Math.floor(Math.random() * gridCount);
            // Verhindert, dass das Futter direkt auf der Schlange spawnt
            let onSnake = false;
            snake.forEach(part => { if(part.x === food.x && part.y === food.y) onSnake = true; });
            if(onSnake) generateFood();
        }
                                                    /* =============== START BLOCK 5 =============== */
        function changeDir(x, y) {
            // Verhindert, dass sich die Schlange direkt in sich selbst umdreht
            if (x !== 0 && dirX === -x) return;
            if (y !== 0 && dirY === -y) return;
            nextDirX = x; nextDirY = y;
        }

        function startSnake() {
            bet = parseInt(document.getElementById("bet-input").value);
            let coins = parseInt(localStorage.getItem("sc_balance_" + currentU) || 1000);
            if (isNaN(bet) || bet <= 0 || bet > coins) { alert("Ungültiger Einsatz!"); return; }

            coins -= bet; localStorage.setItem("sc_balance_" + currentU, coins); updateBalanceDisplay(); pushToCloud();

            document.getElementById("setup-area").style.display = "none"; document.getElementById("play-area").style.display = "block";
            document.getElementById("status-box").style.color = "#ffcc00"; document.getElementById("status-box").innerText = "Schlange läuft! Sammle Diamanten.";

            // Start-Schlange (3 Glieder lang in der Mitte)
            snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
            dirX = 1; dirY = 0; nextDirX = 1; nextDirY = 0;
            collectedDiamonds = 0; currentMultiplier = 1.0; gameActive = true;
            generateFood();

            // Spieltakt (Alle 140 Millisekunden ein Bewegungsschritt)
            if(gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 140);
        }

        function gameLoop() {
            if (!gameActive) return;
            dirX = nextDirX; dirY = nextDirY;

            // Kopf-Position aktualisieren
            let headX = snake[0].x + dirX; let headY = snake[0].y + dirY;

            // Wand-Kollision prüfen
            if (headX < 0 || headX >= gridCount || headY < 0 || headY >= gridCount) { gameOver(); return; }

            // Selbst-Kollision prüfen
            let selfCrash = false;
            snake.forEach(part => { if(part.x === headX && part.y === headY) selfCrash = true; });
            if (selfCrash) { gameOver(); return; }

            // Neuen Kopf vorne anfügen
            let newHead = { x: headX, y: headY };
            snake.unshift(newHead);

            // Futter-Kollision prüfen
            if (headX === food.x && headY === food.y) {
                collectedDiamonds++;
                currentMultiplier += 0.15; // Jedes Futter bringt +0.15x Multiplikator
                playSound("eat"); generateFood();
                document.getElementById("mult-display").innerText = currentMultiplier.toFixed(2) + "x";
                document.getElementById("potential-win").innerText = Math.floor(bet * currentMultiplier);
            } else {
                // Wenn kein Futter gefressen wurde, Schwanzende abschneiden (Bewegung)
                snake.pop();
            }

            // Spielfeld neu zeichnen
            ctx.fillStyle = "#05050a"; ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Futter zeichnen (Ein funkelnder Diamant)
            ctx.font = "16px sans-serif"; ctx.textBaseline = "top";
            ctx.fillText("💎", food.x * tileSize + 2, food.y * tileSize + 2);

            // Schlange zeichnen
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#ff0055" : "#00ffcc"; // Kopf ist pink, Körper ist neongrün
                ctx.fillRect(part.x * tileSize + 1, part.y * tileSize + 1, tileSize - 2, tileSize - 1);
            });
        }

        function gameOver() {
            gameActive = false; clearInterval(gameInterval); playSound("crash");
            document.getElementById("status-box").style.color = "#ff0055"; document.getElementById("status-box").innerText = "CRASH! Schlange zerstört. Einsatz ist weg.";
            setTimeout(resetSnake, 3000);
        }

        function cashoutSnake() {
            if (!gameActive) return; gameActive = false; clearInterval(gameInterval);
            let coins = parseInt(localStorage.getItem("sc_balance_" + currentU) || 1000);
            let totalWin = Math.floor(bet * currentMultiplier); coins += totalWin;
            localStorage.setItem("sc_balance_" + currentU, coins); playSound("cash"); pushToCloud();
            alert("Gewinn erfolgreich gesichert! +" + totalWin + "$ erhalten!");
            resetSnake();
        }

        function resetSnake() {
            updateBalanceDisplay(); document.getElementById("setup-area").style.display = "block"; document.getElementById("play-area").style.display = "none";
            document.getElementById("status-box").style.color = "#ffcc00"; document.getElementById("status-box").innerText = "Platziere deine Casino-Wette!";
        }
    </script>
</body>
</html>
