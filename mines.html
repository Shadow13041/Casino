<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Mines - Shadow Casino</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d11; color: #ffffff; text-align: center; padding: 20px; margin: 0;
        }
        .main-header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;
            position: absolute; top: 0; left: 0; right: 0; z-index: 100; background: rgba(13, 13, 17, 0.9);
        }
        .nav-logo {
            color: #ff0055; text-shadow: 0 0 10px #ff0055; font-size: 1.6rem; font-weight: bold;
            cursor: pointer; text-decoration: none; margin: 0;
        }
        .profile-menu {
            color: #555566; font-size: 0.95rem; cursor: pointer; text-align: right; position: relative;
        }
        .profile-menu:hover { color: #888899; }
              /* =============== START BLOCK 2 =============== */
        .dropdown-content {
            display: none; background: #161622; border: 1px solid #333344; padding: 10px; border-radius: 10px;
            position: absolute; right: 0; top: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 120px; z-index: 200;
        }
        .dropdown-content a { color: #ff0055; text-decoration: none; display: block; margin: 5px 0; font-size: 0.85rem; }
        .game-container {
            background: #161622; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: inline-block; width: 95%; max-width: 460px; margin-top: 100px; text-align: center;
        }
        /* Das 5x5 Spielfeld-Layout */
        .mines-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0;
            background: #05050a; padding: 15px; border-radius: 15px; border: 2px solid #ff0055;
        }
        .tile {
            background: #1e1e2f; height: 65px; line-height: 65px; font-size: 1.8rem;
            border-radius: 10px; border: 1px solid #333344; cursor: pointer; transition: 0.15s;
        }
        .tile:hover { border-color: #ff0055; background: #252538; }
        .tile.revealed-diamond { background: #0a2f29; border-color: #00ffcc; cursor: default; }
        .tile.revealed-mine { background: #3d0c1b; border-color: #ff0055; cursor: default; }
              /* =============== START BLOCK 3 =============== */
        button {
            background: linear-gradient(135deg, #ff0055, #bc003f); color: white; border: none; padding: 12px 25px;
            font-size: 1rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 12px rgba(255, 0, 85, 0.3); margin: 5px;
        }
        button:disabled { background: #444; box-shadow: none; cursor: not-allowed; }
        .cashout-btn { background: linear-gradient(135deg, #00ffcc, #00b38f); color: #0d0d11; box-shadow: none; }
        input {
            width: 70%; padding: 10px; margin: 6px 0; border-radius: 10px; border: 1px solid #333344;
            background: #05050a; color: white; text-align: center; font-size: 1rem;
        }
        .status-text { font-size: 1.1rem; color: #ffcc00; font-weight: bold; margin-top: 15px; height: 25px; }
    </style>
</head>
<body>
    <div class="main-header">
        <div class="nav-logo" onclick="location.href='index.html'">SHADOW CASINO</div>
        <div class="profile-menu">
            <span onclick="toggleDropdown()" id="menu-username">Benutzer</span>
            <div id="profile-dropdown" class="dropdown-content">
                <a href="admin.html" id="admin-panel-link" style="display:none; font-weight:bold; color:#00ffcc;">⚙️ Admin Panel</a>
                <a href="index.html">🏠 Zentrale</a>
                <a href="#" onclick="logout()">Abmelden</a>
            </div>
        </div>
    </div>
  <!-- =============== START BLOCK 4 =============== -->
    <div class="game-container">
        <h2 style="color:#ff0055; margin-top:0;">💎 Diamond Mines</h2>
        <p style="color:#888; font-size:0.9rem; margin-bottom:5px;">Suche die Diamanten und meide die versteckten Minen!</p>
        <div style="font-size: 0.95rem; color: #aaa; margin-bottom: 15px;">Kontostand: <span id="coins-display" style="color:#00ffcc; font-weight:bold;">0</span> $</div>
        
        <div id="setup-area">
            <input type="number" id="bet-input" placeholder="Einsatz in $" value="50"><br>
            <input type="number" id="mines-input" placeholder="Anzahl Minen (1-24)" value="3" min="1" max="24"><br>
            <button onclick="startMines()">Sprengfeld aktivieren</button>
        </div>

        <div id="play-area" style="display: none;">
            <div style="font-size:0.95rem; color:#aaa;">Multiplikator: <span id="mult-display" style="color:#00ffcc; font-weight:bold;">1.00x</span> | Gewinn: <span id="potential-win" style="color:#00ffcc; font-weight:bold;">0</span> $</div>
            
            <!-- Die 25 verdeckten Felder (5x5) -->
            <div class="mines-grid" id="grid-box">
                <!-- Wird per JS dynamisch mit 25 Kacheln gefüllt -->
            </div>
            
            <button class="cashout-btn" id="cash-btn" onclick="cashoutMines()">💵 Gewinn sichern</button>
        </div>
        <div class="status-text" id="status-box">Wähle deinen Einsatz und Minenanzahl!</div>
    </div>
      <!-- =============== START BLOCK 5 =============== -->
    <script>
        let bet = 0; let mineCount = 3; let currentU = ""; let audioCtx = null;
        let board = []; let revealedCount = 0; let gameActive = false; let currentMultiplier = 1.0;
        const CLOUD_URL = "https://jsonbin.io";

        function playSound(type) {
            try {
                if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'diamond') { osc.type = 'sine'; osc.frequency.setValueAtTime(600 + (revealedCount * 50), audioCtx.currentTime); gain.gain.setValueAtTime(0.08, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15); osc.start(); osc.stop(audioCtx.currentTime + 0.15); } 
                else if (type === 'explosion') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.6); gain.gain.setValueAtTime(0.25, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6); osc.start(); osc.stop(audioCtx.currentTime + 0.6); }
                else if (type === 'cash') { osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.08); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }
            } catch(e) {}
        }

        window.onload = function() {
            currentU = localStorage.getItem("sc_username"); if (!currentU) { location.href = "login.html"; return; }
            document.getElementById("menu-username").innerText = currentU;
            const currentRole = localStorage.getItem("sc_role");
            if (currentRole === "Owner" || currentRole === "Admin") { document.getElementById("admin-panel-link").style.display = "block"; }
            updateBalanceDisplay();
        };

        function updateBalanceDisplay() { document.getElementById("coins-display").innerText = localStorage.getItem("sc_balance_" + currentU) || 1000; }
        function toggleDropdown() { const drop = document.getElementById("profile-dropdown"); drop.style.display = drop.style.display === "block" ? "none" : "block"; }
        function logout() { localStorage.removeItem("sc_username"); localStorage.removeItem("sc_role"); localStorage.removeItem("sc_password"); location.href = "login.html"; }

        async function pushToCloud() {
            try {
                let userList = JSON.parse(localStorage.getItem("sc_global_users") || "[]");
                userList.forEach(u => { u.balance = parseInt(localStorage.getItem("sc_balance_" + u.username) || 1000); });
                await fetch(CLOUD_URL, { method: "PUT", headers: { "Content-Type": "application/json", "X-Master-Key": "$2b$10$ShadowCasinoSecretKey12345" }, body: JSON.stringify(userList) });
            } catch(e) {}
        }

        function calculateNextMultiplier() {
            // Exakte, mathematische Casino-Formel für faire Minen-Multiplikatoren
            let totalTiles = 25;
            let diamondsLeft = totalTiles - mineCount;
            let currentX = 1.0;
            for(let i = 0; i < revealedCount + 1; i++) {
                let pool = totalTiles - i;
                let goods = diamondsLeft - i;
                if(pool > 0 && goods >= 0) { currentX = currentX * (pool / goods); }
            }
            return currentX * 0.97; // 3% Hausvorteil für ein realistisches Casino-Feeling
        }

        function startMines() {
            bet = parseInt(document.getElementById("bet-input").value);
            mineCount = parseInt(document.getElementById("mines-input").value);
            let coins = parseInt(localStorage.getItem("sc_balance_" + currentU) || 1000);

            if (isNaN(bet) || bet <= 0 || bet > coins) { alert("Ungültiger Einsatz!"); return; }
            if (isNaN(mineCount) || mineCount < 1 || mineCount > 24) { alert("Minenanzahl muss zwischen 1 und 24 liegen!"); return; }

            coins -= bet; localStorage.setItem("sc_balance_" + currentU, coins); updateBalanceDisplay(); pushToCloud();

            board = []; revealedCount = 0; currentMultiplier = 1.0; gameActive = true;
            for(let i = 0; i < 25; i++) { board.push("diamond"); }

            let placedMines = 0;
            while(placedMines < mineCount) {
                let randIndex = Math.floor(Math.random() * 25);
                if(board[randIndex] === "diamond") { board[randIndex] = "mine"; placedMines++; }
            }

            let gridHTML = "";
            for(let i = 0; i < 25; i++) { gridHTML += `<div class="tile" id="t${i}" onclick="clickTile(${i})">❓</div>`; }
            document.getElementById("grid-box").innerHTML = gridHTML;

            document.getElementById("setup-area").style.display = "none"; document.getElementById("play-area").style.display = "block";
            document.getElementById("mult-display").innerText = "1.00x"; document.getElementById("potential-win").innerText = "0";
            document.getElementById("status-box").style.color = "#ffcc00"; document.getElementById("status-box").innerText = "Sprengfeld aktiv. Finde die Diamanten!";
        }

        function clickTile(index) {
            if (!gameActive) return;
            let tileEl = document.getElementById("t" + index);
            if (tileEl.classList.contains("revealed-diamond") || tileEl.classList.contains("revealed-mine")) return;

            if (board[index] === "mine") {
                gameActive = false; playSound("explosion");
                tileEl.classList.add("revealed-mine"); tileEl.innerText = "💣";
                document.getElementById("status-box").style.color = "#ff0055"; document.getElementById("status-box").innerText = "BOOM! Eine Mine getroffen! Einsatz verloren.";
                
                // Zeige am Ende alle verbliebenen Minen und Diamanten an
                for(let i = 0; i < 25; i++) {
                    let el = document.getElementById("t" + i);
                    if(board[i] === "mine") { el.classList.add("revealed-mine"); el.innerText = "💣"; }
                    else { el.classList.add("revealed-diamond"); el.innerText = "💎"; }
                }
                setTimeout(resetMines, 3500);
            } else {
                playSound("diamond");
                tileEl.classList.add("revealed-diamond"); tileEl.innerText = "💎";
                
                currentMultiplier = calculateNextMultiplier();
                revealedCount++;
                
                document.getElementById("mult-display").innerText = currentMultiplier.toFixed(2) + "x";
                document.getElementById("potential-win").innerText = Math.floor(bet * currentMultiplier);
                document.getElementById("status-box").style.color = "#00ffcc"; document.getElementById("status-box").innerText = "Sicher! Ein weiterer Diamant wurde geborgen.";

                if (revealedCount === (25 - mineCount)) { alert("Absoluter Wahnsinn! Du hast alle Diamanten unbeschadet evakuiert!"); cashoutMines(); }
            }
        }

        function cashoutMines() {
            if (!gameActive) return; gameActive = false;
            let coins = parseInt(localStorage.getItem("sc_balance_" + currentU) || 1000);
            let totalWin = Math.floor(bet * currentMultiplier); coins += totalWin;
            localStorage.setItem("sc_balance_" + currentU, coins); playSound("cash"); pushToCloud();
            alert("Erfolgreich evakuiert! +" + totalWin + "$ gesichert!");
            resetMines();
        }

        function resetMines() {
            updateBalanceDisplay(); document.getElementById("setup-area").style.display = "block"; document.getElementById("play-area").style.display = "none";
            document.getElementById("status-box").style.color = "#ffcc00"; document.getElementById("status-box").innerText = "Wähle deinen Einsatz und Minenanzahl!";
        }
    </script>
</body>
</html>
