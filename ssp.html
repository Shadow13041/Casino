<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schere Stein Papier - Shadow Casino</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d11; color: #ffffff; text-align: center; padding: 20px; margin: 0;
        }
        .main-header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;
            position: absolute; top: 0; left: 0; right: 0; z-index: 100; background: rgba(13, 13, 17, 0.9);
        }
        .nav-logo {
            color: #ff0055; text-shadow: 0 0 10px #ff0055; font-size: 1.6rem; font-weight: bold;
            cursor: pointer; text-decoration: none; margin: 0;
        }
        .profile-menu {
            color: #555566; font-size: 0.95rem; cursor: pointer; text-align: right; position: relative;
        }
        .profile-menu:hover { color: #888899; }
                  /* =============== START BLOCK 2 =============== */
        .dropdown-content {
            display: none; background: #161622; border: 1px solid #333344; padding: 10px; border-radius: 10px;
            position: absolute; right: 0; top: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 120px; z-index: 200;
        }
        .dropdown-content a { color: #ff0055; text-decoration: none; display: block; margin: 5px 0; font-size: 0.85rem; }
        .game-container {
            background: #161622; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: inline-block; width: 90%; max-width: 440px; margin-top: 100px; text-align: center;
        }
        .arena-box { display: flex; justify-content: space-around; align-items: center; margin: 20px 0; background: #05050a; padding: 15px; border-radius: 15px; border: 2px solid #ff0055; }
        .fighter { font-size: 3rem; font-weight: bold; }
        .choice-grid { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        button {
            background: linear-gradient(135deg, #ff0055, #bc003f); color: white; border: none; padding: 12px 20px;
            font-size: 1rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 12px rgba(255, 0, 85, 0.3);
        }
        button:disabled { background: #444; box-shadow: none; cursor: not-allowed; }
              /* =============== START BLOCK 3 =============== */
        .btn-choice { background: #1e1e2f; border: 2px solid #333344; font-size: 2rem; padding: 15px; border-radius: 15px; width: 85px; box-shadow: none; }
        .btn-choice:hover { border-color: #ff0055; background: #252538; }
        input {
            width: 60%; padding: 10px; margin: 10px 0; border-radius: 10px; border: 1px solid #333344;
            background: #05050a; color: white; text-align: center; font-size: 1rem;
        }
        .status-text { font-size: 1.1rem; color: #ffcc00; font-weight: bold; margin-top: 15px; height: 25px; }
    </style>
</head>
<body>
    <div class="main-header">
        <div class="nav-logo" onclick="location.href='index.html'">SHADOW CASINO</div>
        <div class="profile-menu">
            <span onclick="toggleDropdown()" id="menu-username">Benutzer</span>
            <div id="profile-dropdown" class="dropdown-content">
                <a href="admin.html" id="admin-panel-link" style="display:none; font-weight:bold; color:#00ffcc;">⚙️ Admin Panel</a>
                <a href="index.html">🏠 Zentrale</a>
                <a href="#" onclick="logout()">Abmelden</a>
            </div>
        </div>
    </div>
  <!-- =============== START BLOCK 4 =============== -->
    <div class="game-container">
        <h2 style="color:#ff0055; margin-top:0;">🤖 Shadow Duell</h2>
        <p style="color:#888; font-size:0.9rem; margin-bottom:5px;">Schere, Stein, Papier gegen das System. Verdoppele deinen Einsatz bei einem Sieg!</p>
        <div style="font-size: 0.95rem; color: #aaa; margin-bottom: 15px;">Kontostand: <span id="coins-display" style="color:#00ffcc; font-weight:bold;">0</span> $</div>
        
        <div id="setup-area">
            <input type="number" id="bet-input" placeholder="Einsatz in $" value="50"><br>
            <button onclick="lockBet()">Einsatz platzieren</button>
        </div>
        <div id="play-area" style="display: none;">
            <div class="arena-box">
                <div><div style="font-size:0.8rem;color:#888;margin-bottom:5px;">Du</div><div class="fighter" id="player-box">❓</div></div>
                <div style="font-size:1.5rem;color:#ff0055;font-weight:bold;">VS</div>
                <div><div style="font-size:0.8rem;color:#888;margin-bottom:5px;">Bot</div><div class="fighter" id="bot-box">❓</div></div>
            </div>
            <div class="choice-grid">
                <button class="btn-choice" onclick="playDuel('schere')">✂️</button>
                <button class="btn-choice" onclick="playDuel('stein')">🪨</button>
                <button class="btn-choice" onclick="playDuel('papier')">📄</button>
            </div>
        </div>
        <div class="status-text" id="status-box">Wähle deinen Spieleinsatz!</div>
    </div>
      <!-- =============== START BLOCK 5 =============== -->
    <script>
        let bet = 0; let currentU = ""; let audioCtx = null;
        const botChoices = "schere,stein,papier".split(",");

        function playSound(type) {
            try {
                if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'win') { osc.type = 'square'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); } 
                else if (type === 'lose') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(70, audioCtx.currentTime + 0.3); gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }
                else if (type === 'draw') { osc.type = 'sine'; osc.frequency.setValueAtTime(350, audioCtx.currentTime); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); osc.start(); osc.stop(audioCtx.currentTime + 0.2); }
            } catch(e) {}
        }

        window.onload = function() {
            currentU = localStorage.getItem("sc_username"); if (!currentU) { location.href = "login.html"; return; }
            document.getElementById("menu-username").innerText = currentU;
            const currentRole = localStorage.getItem("sc_role");
            if (currentRole === "Owner" || currentRole === "Admin") { document.getElementById("admin-panel-link").style.display = "block"; }
            updateBalanceDisplay();
        };

        function updateBalanceDisplay() { document.getElementById("coins-display").innerText = localStorage.getItem("sc_balance_" + currentU) || 1000; }
        function toggleDropdown() { const drop = document.getElementById("profile-dropdown"); drop.style.display = drop.style.display === "block" ? "none" : "block"; }
        function logout() { localStorage.removeItem("sc_username"); localStorage.removeItem("sc_role"); localStorage.removeItem("sc_password"); location.href = "login.html"; }

        async function pushToCloud() {
            try {
                let userList = JSON.parse(localStorage.getItem("sc_global_users") || "[]");
                userList.forEach(u => { u.balance = parseInt(localStorage.getItem("sc_balance_" + u.username) || 1000); });
                await fetch("https://kvdb.io", { method: "PUT", body: JSON.stringify(userList) });
            } catch(e) {}
        }

        function lockBet() {
            bet = parseInt(document.getElementById("bet-input").value);
            let coins = parseInt(localStorage.getItem("sc_balance_" + currentU) || 1000);
            if (isNaN(bet) || bet <= 0 || bet > coins) { alert("Ungültiger Einsatz!"); return; }
            coins -= bet; localStorage.setItem("sc_balance_" + currentU, coins); updateBalanceDisplay(); pushToCloud();
            document.getElementById("setup-area").style.display = "none"; document.getElementById("play-area").style.display = "block";
            document.getElementById("player-box").innerText = "❓"; document.getElementById("bot-box").innerText = "❓";
            document.getElementById("status-box").style.color = "#ffcc00"; document.getElementById("status-box").innerText = "Wähle deine Waffe aus!";
        }

        function playDuel(playerChoice) {
            let botChoice = botChoices[Math.floor(Math.random() * 3)];
            const emoMap = { schere: "✂️", stein: "🪨", papier: "📄" };
            
            document.getElementById("player-box").innerText = emoMap[playerChoice];
            document.getElementById("bot-box").innerText = emoMap[botChoice];
            
            let result = "lose";
            if (playerChoice === botChoice) { result = "draw"; }
            else if ((playerChoice === "schere" && botChoice === "papier") || (playerChoice === "stein" && botChoice === "schere") || (playerChoice === "papier" && botChoice === "stein")) { result = "win"; }
            
            let coins = parseInt(localStorage.getItem("sc_balance_" + currentU) || 1000);
            if (result === "win") {
                let totalWin = bet * 2; coins += totalWin; localStorage.setItem("sc_balance_" + currentU, coins);
                playSound("win"); document.getElementById("status-box").style.color = "#00ffcc"; document.getElementById("status-box").innerText = "SIEG! Du schlägst den Bot! +" + totalWin + "$";
            } else if (result === "draw") {
                coins += bet; localStorage.setItem("sc_balance_" + currentU, coins);
                playSound("draw"); document.getElementById("status-box").style.color = "#ffcc00"; document.getElementById("status-box").innerText = "Unentschieden! Einsatz zurückerstattet.";
            } else {
                playSound("lose"); document.getElementById("status-box").style.color = "#ff0055"; document.getElementById("status-box").innerText = "NIEDERLAGE! Der Bot gewinnt diese Runde.";
            }
            
            updateBalanceDisplay(); pushToCloud();
            setTimeout(() => {
                document.getElementById("setup-area").style.display = "block"; document.getElementById("play-area").style.display = "none";
            }, 2000);
        }
    </script>
</body>
</html>
