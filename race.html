<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pferderennen - Shadow Casino</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d11; color: #ffffff; text-align: center; padding: 20px; margin: 0;
        }
        .main-header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;
            position: absolute; top: 0; left: 0; right: 0; z-index: 100; background: rgba(13, 13, 17, 0.9);
        }
        .nav-logo {
            color: #ff0055; text-shadow: 0 0 10px #ff0055; font-size: 1.6rem; font-weight: bold;
            cursor: pointer; text-decoration: none; margin: 0;
        }
        .profile-menu {
            color: #555566; font-size: 0.95rem; cursor: pointer; text-align: right; position: relative;
        }
        .profile-menu:hover { color: #888899; }
                /* =============== START BLOCK 2 =============== */
        .dropdown-content {
            display: none; background: #161622; border: 1px solid #333344; padding: 10px; border-radius: 10px;
            position: absolute; right: 0; top: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 120px; z-index: 200;
        }
        .dropdown-content a { color: #ff0055; text-decoration: none; display: block; margin: 5px 0; font-size: 0.85rem; }
        .game-container {
            background: #161622; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: inline-block; width: 95%; max-width: 500px; margin-top: 100px; text-align: center;
        }
        .race-track {
            background: #05050a; padding: 15px 10px; border-radius: 15px; border: 2px solid #ff0055; margin: 20px 0;
            display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden;
        }
        .lane {
            height: 45px; border-bottom: 1px dashed #333344; position: relative; display: flex; align-items: center; justify-content: flex-start;
        }
        .lane:last-child { border-bottom: none; }
        .horse {
            font-size: 2.2rem; position: absolute; left: 0px; 
            transform: scaleX(-1); /* Spiegelt das Pferd, damit es nach rechts schaut */
            will-change: transform;
        }
                /* =============== START BLOCK 3 =============== */
        .finish-line {
            position: absolute; right: 15px; top: 0; bottom: 0; width: 8px;
            background: repeating-linear-gradient(0deg, #fff, #fff 10px, #000 10px, #000 20px); z-index: 10;
        }
        button {
            background: linear-gradient(135deg, #ff0055, #bc003f); color: white; border: none; padding: 12px 25px;
            font-size: 1.1rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
        }
        button:disabled { background: #444; box-shadow: none; cursor: not-allowed; }
        input, select {
            width: 70%; padding: 10px; margin: 8px 0; border-radius: 10px; border: 1px solid #333344;
            background: #05050a; color: white; text-align: center; font-size: 1rem;
        }
        .status-text { font-size: 1.1rem; color: #ffcc00; font-weight: bold; margin-top: 15px; height: 25px; }
    </style>
</head>
<body>
    <div class="main-header">
        <div class="nav-logo" onclick="location.href='index.html'">SHADOW CASINO</div>
        <div class="profile-menu">
            <span onclick="toggleDropdown()" id="menu-username">Benutzer</span>
            <div id="profile-dropdown" class="dropdown-content">
                <a href="admin.html" id="admin-panel-link" style="display:none; font-weight:bold; color:#00ffcc;">⚙️ Admin Panel</a>
                <a href="index.html">🏠 Zentrale</a>
                <a href="#" onclick="logout()">Abmelden</a>
            </div>
        </div>
    </div>
    <!-- =============== START BLOCK 4 =============== -->
    <div class="game-container">
        <h2 style="color:#ff0055; margin-top:0;">
        Derby</h2>
        <p style="color:#888; font-size:0.9rem; margin-bottom:5px;">Setze auf deinen Favoriten. Ein richtiger Tipp bringt den 5-fachen Gewinn!</p>
        <div style="font-size: 0.95rem; color: #aaa; margin-bottom: 15px;">Kontostand: <span id="coins-display" style="color:#00ffcc; font-weight:bold;">0</span> $</div>
        
        <div id="setup-area">
            <input type="number" id="bet-input" placeholder="Einsatz in $" value="50"><br>
            <select id="horse-select">
                <option value="1">Pferd 1 (Anfang) (🏇)</option>
                <option value="2">Pferd 2 (Hell) (🏇🏻)</option>
                <option value="3">Pferd 3 (Mittel) (🏇🏼)</option>
                <option value="4">Pferd 4 (Dunkel) (🏇🏽)</option>
                <option value="5">Pferd 5 (Schwarz) (🏇🏾)</option>
            </select><br>
            <button id="start-btn" onclick="startRace()">Rennen starten</button>
        </div>
        
        <div class="race-track">
            <div class="finish-line"></div>
            <div class="lane"><div id="h1" class="horse">🏇</div></div>
            <div class="lane"><div id="h2" class="horse">🏇🏻</div></div>
            <div class="lane"><div id="h3" class="horse">🏇🏼</div></div>
            <div class="lane"><div id="h4" class="horse">🏇🏽</div></div>
            <div class="lane"><div id="h5" class="horse">🏇🏾</div></div>
        </div>
        <div class="status-text" id="status-box">Platziere deine Wette!</div>
    </div>
        <!-- =============== START BLOCK 5 =============== -->
    <script>
        let bet = 0; let chosenHorse = 1; let currentU = ""; let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'gallop') { osc.type = 'triangle'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); gain.gain.setValueAtTime(0.04, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08); osc.start(); osc.stop(audioCtx.currentTime + 0.08); }
                else if (type === 'win') { osc.type = 'square'; osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); } 
                else if (type === 'lose') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(130, audioCtx.currentTime); gain.gain.setValueAtTime(0.12, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }
            } catch(e) {}
        }

        window.onload = function() {
            currentU = localStorage.getItem("sc_username"); if (!currentU) { location.href = "login.html"; return; }
            document.getElementById("menu-username").innerText = currentU;
            const currentRole = localStorage.getItem("sc_role");
            if (currentRole === "Owner" || currentRole === "Admin") { document.getElementById("admin-panel-link").style.display = "block"; }
            updateBalanceDisplay();
        };

        function updateBalanceDisplay() { document.getElementById("coins-display").innerText = localStorage.getItem("sc_balance_" + currentU) || 1000; }
        function toggleDropdown() { const drop = document.getElementById("profile-dropdown"); drop.style.display = drop.style.display === "block" ? "none" : "block"; }
        function logout() { localStorage.removeItem("sc_username"); localStorage.removeItem("sc_role"); localStorage.removeItem("sc_password"); location.href = "login.html"; }

        async function pushToCloud() {
            try {
                let userList = JSON.parse(localStorage.getItem("sc_global_users") || "[]");
                userList.forEach(u => { u.balance = parseInt(localStorage.getItem("sc_balance_" + u.username) || 1000); });
                await fetch("https://kvdb.io", { method: "PUT", body: JSON.stringify(userList) });
            } catch(e) {}
        }

        function startRace() {
            bet = parseInt(document.getElementById("bet-input").value);
            chosenHorse = parseInt(document.getElementById("horse-select").value);
            let coins = parseInt(localStorage.getItem("sc_balance_" + currentU) || 1000);

            if (isNaN(bet) || bet <= 0 || bet > coins) { alert("Ungültiger Einsatz!"); return; }
            coins -= bet; localStorage.setItem("sc_balance_" + currentU, coins); updateBalanceDisplay(); pushToCloud();
            
            document.getElementById("start-btn").disabled = true;
            document.getElementById("status-box").style.color = "#ffcc00"; document.getElementById("status-box").innerText = "Die Boxen öffnen sich! Sie rennen nach rechts!";

            // Setzt alle Pferde flüssig an den linken Startrand zurück
            for (let i = 1; i <= 5; i++) {
                let h = document.getElementById("h" + i);
                h.style.transition = "none"; 
                h.style.left = "0px";
                h.style.transform = "scaleX(-1)"; // Schauen nach rechts
            }

            let rawDistances = "100,85,70,65,50".split(",").map(Number);
            let finalDistances = [];
            
            while(rawDistances.length > 0) {
                let randIndex = Math.floor(Math.random() * rawDistances.length);
                finalDistances.push(rawDistances[randIndex]);
                rawDistances.splice(randIndex, 1);
            }

            let soundInterval = setInterval(() => { playSound('gallop'); }, 250);

            setTimeout(() => {
                // Berechnet das Spielfeld abzüglich der Pferdebreite (ca. 45px)
                let trackWidth = document.querySelector(".race-track").clientWidth - 65;
                
                for (let i = 1; i <= 5; i++) {
                    let h = document.getElementById("h" + i);
                    let pct = finalDistances[i - 1];
                    let movePixels = Math.floor((pct / 100) * trackWidth);
                    
                    // KORREKTUR: Nutzt left-Verschiebung gepaart mit scaleX, damit sie flüssig und echt nach rechts preschen!
                    h.style.transition = "left 5s linear";
                    h.style.left = movePixels + "px";
                }
            }, 50);

            setTimeout(() => {
                clearInterval(soundInterval);
                let winnerHorseIndex = 0;
                for(let i = 0; i < 5; i++) { if(finalDistances[i] === 100) { winnerHorseIndex = i + 1; } }

                let wonCoins = parseInt(localStorage.getItem("sc_balance_" + currentU) || 1000);
                if (chosenHorse === winnerHorseIndex) {
                    let totalWin = bet * 5; wonCoins += totalWin;
                    localStorage.setItem("sc_balance_" + currentU, wonCoins); playSound('win');
                    document.getElementById("status-box").style.color = "#00ffcc";
                    document.getElementById("status-box").innerText = "SIEG! Pferd " + winnerHorseIndex + " überquert zuerst die Ziellinie! +" + totalWin + "$!";
                } else {
                    playSound('lose'); document.getElementById("status-box").style.color = "#ff0055";
                    document.getElementById("status-box").innerText = "Einsatz verloren! Pferd " + winnerHorseIndex + " holt den Pokal.";
                }
                
                updateBalanceDisplay(); pushToCloud();
                document.getElementById("start-btn").disabled = false;
            }, 5100);
        }
    </script>
</body>
</html>
