<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Casino - Einloggen</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d11; color: #ffffff; text-align: center; padding: 15px; margin: 0;
        }
        .auth-container {
            background: #161622; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: inline-block; width: 95%; max-width: 360px; margin-top: 100px; text-align: center; box-sizing: border-box;
        }
        h2 { color: #ff0055; margin-top: 0; font-size: 1.8rem; text-shadow: 0 0 10px rgba(255,0,85,0.3); }
        input {
            width: 90%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #333344;
            background: #05050a; color: white; text-align: center; font-size: 1rem; box-sizing: border-box;
        }
        button {
            background: linear-gradient(135deg, #ff0055, #bc003f); color: white; border: none; padding: 12px 25px;
            font-size: 1.1rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
            width: 90%; margin-top: 10px;
        }
        .switch-mode-text { margin-top: 15px; font-size: 0.85rem; color: #aaa; cursor: pointer; }
        .switch-mode-text span { color: #ff0055; font-weight: bold; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2 id="auth-title">EINLOGGEN</h2>
        <input type="text" id="username-input" placeholder="Benutzername">
        <input type="password" id="password-input" placeholder="Passwort">
        <button id="auth-btn">Anmelden</button>
        <div class="switch-mode-text" id="toggle-mode-box">Neu hier? <span>Konto erstellen</span></div>
    </div>
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, get, set } from "https://gstatic.com";
        const firebaseConfig = {
            apiKey: "AIzaSyAZzQ_oKZ3maWTGgj0eCih0jhSAumH6WQQ",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebasedatabase.app",
            projectId: "shadow-casino",
            storageBucket: "shadow-casino.firebasestorage.app",
            messagingSenderId: "389676429525",
            appId: "1:389676429525:web:37ed2f98d0205d6778325c"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let isRegisterMode = false;
        const toggleBox = document.getElementById("toggle-mode-box");
        const authBtn = document.getElementById("auth-btn");
        toggleBox.addEventListener("click", () => {
            isRegisterMode = !isRegisterMode;
            document.getElementById("auth-title").innerText = isRegisterMode ? "REGISTRIEREN" : "EINLOGGEN";
            authBtn.innerText = isRegisterMode ? "Konto erstellen" : "Anmelden";
            toggleBox.innerHTML = isRegisterMode ? "Bereits registriert? <span>Einloggen</span>" : "Neu hier? <span>Konto erstellen</span>";
        });
                authBtn.addEventListener("click", async () => {
            const uInput = document.getElementById("username-input").value.trim();
            const pInput = document.getElementById("password-input").value.trim();
            if (!uInput || !pInput) { alert("Bitte fülle alle Felder aus!"); return; }
            const cleanUserKey = uInput.replace(/[.#$\[\]]/g, "");
            const userRef = ref(db, "users/" + cleanUserKey);
            try {
                const snapshot = await get(userRef);
                if (isRegisterMode) {
                    if (snapshot.exists()) { alert("Dieser Benutzername ist bereits vergeben!"); return; }
                    let cryptoArray = new Uint32Array(1); window.crypto.getRandomValues(cryptoArray);
                    let deviceId = cryptoArray.at(0).toString(16);
                    let initialRole = "User";
                    if (uInput === "Shadow") initialRole = "Owner";
                    let userObj = {
                        username: uInput,
                        pass: pInput,
                        balance: 1000,
                        role: initialRole,
                        id: deviceId,
                        browser: "Chrome Mobile",
                        os: "Android 14"
                    };
                    await set(userRef, userObj);
                    alert("🎉 Registrierung erfolgreich! Du kannst dich jetzt einloggen.");
                    isRegisterMode = false;
                    document.getElementById("auth-title").innerText = "EINLOGGEN";
                    authBtn.innerText = "Anmelden";
                    toggleBox.innerHTML = "Neu hier? <span>Konto erstellen</span>";
                } else {
                    if (!snapshot.exists()) { alert("Benutzerkonto existiert nicht!"); return; }
                    const userData = snapshot.val();
                    if (userData.pass !== pInput) { alert("Falsches Passwort!"); return; }
                    let bannedRef = ref(db, "bans/users/" + cleanUserKey);
                    let bannedSnapshot = await get(bannedRef);
                    if (bannedSnapshot.exists()) { alert("Dieses Konto wurde gesperrt!"); return; }
                                        let devBannedRef = ref(db, "bans/devices/" + userData.id);
                    let devBannedSnapshot = await get(devBannedRef);
                    if (devBannedSnapshot.exists()) { alert("Dein Gerät wurde dauerhaft gesperrt!"); return; }
                    localStorage.setItem("sc_username", userData.username);
                    localStorage.setItem("sc_role", userData.role);
                    localStorage.setItem("sc_password", userData.pass);
                    localStorage.setItem("sc_balance_" + userData.username, userData.balance);
                    location.href = "index.html";
                }
            } catch (err) {
                alert("Fehler bei der Cloud-Verbindung!");
            }
        });
    </script>
</body>
</html>
