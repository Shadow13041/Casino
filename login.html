<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Casino - Einloggen</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d11; color: #ffffff; text-align: center; padding: 15px; margin: 0;
        }
        .auth-container {
            background: #161622; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: inline-block; width: 95%; max-width: 360px; margin-top: 100px; text-align: center; box-sizing: border-box;
        }
        h2 { color: #ff0055; margin-top: 0; font-size: 1.8rem; text-shadow: 0 0 10px rgba(255,0,85,0.3); }
        input {
            width: 90%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #333344;
            background: #05050a; color: white; text-align: center; font-size: 1rem; box-sizing: border-box;
        }
        button {
            background: linear-gradient(135deg, #ff0055, #bc003f); color: white; border: none; padding: 12px 25px;
            font-size: 1.1rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
            width: 90%; margin-top: 10px;
        }
        .switch-mode-text { margin-top: 15px; font-size: 0.85rem; color: #aaa; cursor: pointer; }
        .switch-mode-text span { color: #ff0055; font-weight: bold; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2 id="auth-title">EINLOGGEN</h2>
        <input type="text" id="username-input" placeholder="Benutzername">
        <input type="password" id="password-input" placeholder="Passwort">
        <button id="auth-btn" onclick="processAuth()">Anmelden</button>
        <div class="switch-mode-text" id="toggle-mode-box" onclick="toggleMode()">Neu hier? <span>Konto erstellen</span></div>
    </div>

    <script>
        let isRegisterMode = false;

        function toggleMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById("auth-title").innerText = isRegisterMode ? "REGISTRIEREN" : "EINLOGGEN";
            document.getElementById("auth-btn").innerText = isRegisterMode ? "Konto erstellen" : "Anmelden";
            document.getElementById("toggle-mode-box").innerHTML = isRegisterMode ? "Bereits registriert? <span>Einloggen</span>" : "Neu hier? <span>Konto erstellen</span>";
        }

        function processAuth() {
            const uInput = document.getElementById("username-input").value.trim();
            const pInput = document.getElementById("password-input").value.trim();
            
            if (!uInput || !pInput) { 
                alert("Bitte fülle alle Felder aus!"); 
                return; 
            }

            // Alle Nutzer werden in einem lokalen JSON-Objekt im localStorage verwaltet
            let users = JSON.parse(localStorage.getItem("casino_local_users")) || {};
            const cleanUserKey = uInput.toLowerCase().replace(/[.#$\[\]]/g, "");

            if (isRegisterMode) {
                // Registrierungs-Logik
                if (users[cleanUserKey]) { 
                    alert("Dieser Benutzername ist bereits vergeben!"); 
                    return; 
                }

                let cryptoArray = new Uint32Array(1); 
                window.crypto.getRandomValues(cryptoArray);
                let deviceId = cryptoArray.toString(16);
                
                let initialRole = "User";
                if (uInput === "Shadow") initialRole = "Owner";

                // Neuen Benutzer speichern
                users[cleanUserKey] = {
                    username: uInput,
                    pass: pInput,
                    balance: 1000,
                    role: initialRole,
                    id: deviceId
                };

                localStorage.setItem("casino_local_users", JSON.stringify(users));
                alert("🎉 Registrierung erfolgreich! Du kannst dich jetzt einloggen.");
                toggleMode();
                
            } else {
                // Login-Logik
                if (!users[cleanUserKey]) { 
                    alert("Benutzerkonto existiert nicht!"); 
                    return; 
                }

                const userData = users[cleanUserKey];
                
                if (userData.pass !== pInput) { 
                    alert("Falsches Passwort!"); 
                    return; 
                }

                // Login-Session für das Dashboard (index.html) vorbereiten
                localStorage.setItem("sc_username", userData.username);
                localStorage.setItem("sc_role", userData.role);
                localStorage.setItem("sc_password", userData.pass);
                localStorage.setItem("sc_balance_" + userData.username, userData.balance);
                
                // Weiterleitung zum Dashboard
                location.href = "index.html";
            }
        }
    </script>
</body>
</html>
