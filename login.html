<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Casino - Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d11; color: #ffffff; text-align: center; padding: 20px; margin: 0;
        }
        .main-header {
            display: flex; justify-content: center; align-items: center; padding: 15px 20px;
            position: absolute; top: 0; left: 0; right: 0; z-index: 100; background: rgba(13, 13, 17, 0.9);
        }
        .nav-logo {
            color: #ff0055; text-shadow: 0 0 10px #ff0055; font-size: 1.6rem; font-weight: bold;
            cursor: pointer; text-decoration: none; margin: 0;
        }
                /* =============== START BLOCK 2 =============== */
        .auth-container {
            background: #161622; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: inline-block; width: 90%; max-width: 360px; margin-top: 120px; text-align: center;
        }
        button {
            background: linear-gradient(135deg, #ff0055, #bc003f); color: white; border: none; padding: 12px 25px;
            font-size: 1.1rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
            margin-top: 10px; width: 85%;
        }
        input {
            width: 80%; padding: 10px; margin: 8px 0; border-radius: 10px; border: 1px solid #333344;
            background: #05050a; color: white; text-align: center; font-size: 1rem;
        }
    </style>
</head>
<!-- =============== START BLOCK 3 =============== -->
<body>
    <div class="main-header">
        <div class="nav-logo" onclick="location.reload()">SHADOW CASINO</div>
    </div>
    
    <div id="auth-box" class="auth-container">
        <h2 style="color:#ff0055; margin-top:0; font-size:1.8rem; text-shadow: 0 0 10px rgba(255,0,85,0.3);">LOGIN</h2>
        <h3 style="margin-top:0; color:#aaa; font-size:0.95rem; margin-bottom:15px;">Einloggen oder Registrieren</h3>
        <input type="text" id="username-input" placeholder="Benutzername" required><br>
        <input type="password" id="password-input" placeholder="Passwort" required><br>
        <button onclick="authAction()">Bestätigen</button>
    </div>
        <!-- =============== START BLOCK 4 =============== -->
    <script>
        let deviceName = "Xiaomi Redmi";
        
        // !!! KORREKTUR: TRAGE HIER DEINE ECHTEN GITHUB-DATEN EIN !!!
        const GH_USER = "DEIN_GITHUB_NAME"; 
        const GH_REPO = "DEIN_CASINO_ORDNER_NAME";
        const GH_TOKEN = "DEIN_EBEN_GENERIERT_TOKEN_GHP_..."; 
        
        let currentFileSha = ""; // Wird von GitHub benötigt, um die Datei zu überschreiben

        async function syncFromCloud() {
            try {
                // Holt die users.json direkt aus deinem GitHub-Projekt
                const res = await fetch(`https://github.com{GH_USER}/${GH_REPO}/contents/users.json`, {
                    headers: { "Authorization": `token ${GH_TOKEN}`, "Accept": "application/vnd.github.v3+json" }
                });
                if(res.ok) {
                    const data = await res.json();
                    currentFileSha = data.sha; // Speichert den aktuellen Datei-Fingerabdruck
                    // Dekodiert den Base64-Text von GitHub in normales JSON
                    let decryptedText = decodeURIComponent(escape(atob(data.content)));
                    localStorage.setItem("sc_global_users", decryptedText);
                }
            } catch(e) { console.log("GitHub-Ladefehler"); }
            
            let userList = JSON.parse(localStorage.getItem("sc_global_users") || "[]");
            if (!userList.some(u => u.username === "Shadow")) {
                userList.push({ id: "OWNER-PHONE", username: "Shadow", pass: "shadow-admin", browser: "Chrome Mobile", os: "Android", role: "Owner" });
                localStorage.setItem("sc_global_users", JSON.stringify(userList));
            }
        }

        async function saveToCloud(userList) {
            try {
                let jsonString = JSON.stringify(userList);
                // Konvertiert den Text in das von GitHub verlangte Base64-Format
                let b64Content = btoa(unescape(encodeURIComponent(jsonString)));
                
                await fetch(`https://github.com{GH_USER}/${GH_REPO}/contents/users.json`, {
                    method: "PUT",
                    headers: { "Authorization": `token ${GH_TOKEN}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: "Casino-Cloud: Konten-Update",
                        content: b64Content,
                        sha: currentFileSha
                    })
                });
            } catch(e) { console.log("GitHub-Schreibfehler"); }
        }
                /* =============== START BLOCK 5 =============== */
        async function authAction() {
            const user = document.getElementById("username-input").value.trim(); 
            const pass = document.getElementById("password-input").value.trim();
            if(!user || !pass) { alert("Bitte ausfüllen!"); return; }
            
            let bannedUsers = JSON.parse(localStorage.getItem("sc_banned_users") || "[]");
            if (bannedUsers.includes(user)) { alert("Dieser Account wurde gebannt."); return; }
            
            await syncFromCloud();
            let userList = JSON.parse(localStorage.getItem("sc_global_users") || "[]"); 
            let foundUser = userList.find(u => u.username.toLowerCase() === user.toLowerCase());
            
            if (foundUser) {
                if (foundUser.pass === pass) {
                    localStorage.setItem("sc_username", foundUser.username); 
                    localStorage.setItem("sc_role", foundUser.role || "User"); 
                    localStorage.setItem("sc_password", foundUser.pass);
                    if(!localStorage.getItem("sc_balance_" + foundUser.username)) {
                        localStorage.setItem("sc_balance_" + foundUser.username, 1000);
                    }
                    location.href = "index.html";
                } else { alert("Falsches Passwort!"); }
            } else {
                if (user.toLowerCase() === "shadow") { alert("Name reserviert!"); return; }
                userList.push({ id: deviceName, username: user, pass: pass, browser: "Chrome Mobile", os: "Android", role: "User" });
                localStorage.setItem("sc_global_users", JSON.stringify(userList)); 
                await saveToCloud(userList);
                
                localStorage.setItem("sc_username", user); 
                localStorage.setItem("sc_role", "User"); 
                localStorage.setItem("sc_password", pass);
                localStorage.setItem("sc_balance_" + user, 1000);
                location.href = "index.html";
            }
        }

        window.onload = async function() {
            if(!navigator.userAgent.includes("Android")) { deviceName = "PC / Desktop"; }
            let bannedDevices = JSON.parse(localStorage.getItem("sc_banned_devices") || "[]");
            if (bannedDevices.includes(deviceName)) { 
                document.body.innerHTML = "<h1 style='color:#ff0055; margin-top:100px;'>GERÄT GEBANNT</h1>"; 
                return; 
            }
            await syncFromCloud();
            if (localStorage.getItem("sc_username")) { location.href = "index.html"; }
        };
    </script>
</body>
</html>
