<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Casino - Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d11; color: #ffffff; text-align: center; padding: 20px; margin: 0;
        }
        .main-header {
            display: flex; justify-content: center; align-items: center; padding: 15px 20px;
            position: absolute; top: 0; left: 0; right: 0; z-index: 100; background: rgba(13, 13, 17, 0.9);
        }
        .nav-logo {
            color: #ff0055; text-shadow: 0 0 10px #ff0055; font-size: 1.6rem; font-weight: bold;
            letter-spacing: 2px;
        }
        .auth-box {
            background: #161622; padding: 30px 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: inline-block; width: 90%; max-width: 380px; margin-top: 120px; text-align: center; box-sizing: border-box;
        }
        .toggle-links { margin-top: 15px; font-size: 0.9rem; }
        .toggle-links a { color: #00ffcc; text-decoration: none; font-weight: bold; cursor: pointer; }
        .toggle-links a:hover { color: #ff0055; }
        input {
            width: 85%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #333344;
            background: #05050a; color: white; text-align: center; font-size: 1rem; outline: none;
        }
        input:focus { border-color: #ff0055; box-shadow: 0 0 8px rgba(255, 0, 85, 0.2); }
        button {
            background: linear-gradient(135deg, #ff0055, #bc003f); color: white; border: none; padding: 12px 30px;
            font-size: 1.1rem; font-weight: bold; border-radius: 50px; cursor: pointer; margin-top: 15px;
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4); width: 85%;
        }
        button:hover { transform: translateY(-1px); }
        #register-view { display: none; }
    </style>
</head>
<body>
    <div class="main-header">
        <div class="nav-logo">SHADOW CASINO</div>
    </div>

    <!-- Login Ansicht -->
    <div id="login-view" class="auth-box">
        <h2 style="color:#ff0055; margin-top:0; font-size:1.6rem;">Anmelden</h2>
        <p style="color:#888; font-size:0.85rem; margin-top:-5px;">Betrete die Schatten-Zentrale</p>
        
        <input type="text" id="login-username" placeholder="Benutzername"><br>
        <input type="password" id="login-password" placeholder="Passwort"><br>
        
        <button onclick="handleLogin()">Einloggen</button>
        
        <div class="toggle-links">
            Noch kein Konto? <a onclick="switchAuthView('register')">Registrieren</a>
        </div>
    </div>

    <!-- Registrierungs Ansicht -->
    <div id="register-view" class="auth-box">
        <h2 style="color:#ffcc00; margin-top:0; font-size:1.6rem;">Registrieren</h2>
        <p style="color:#888; font-size:0.85rem; margin-top:-5px;">Erstelle dein lokales Spielerkonto</p>
        
        <input type="text" id="reg-username" placeholder="Wunsch-Benutzername"><br>
        <input type="password" id="reg-password" placeholder="Sicheres Passwort"><br>
        
        <button onclick="handleRegister()" style="background: linear-gradient(135deg, #ffcc00, #b38f00); color: #0d0d11;">Konto erstellen</button>
        
        <div class="toggle-links">
            Bereits registriert? <a onclick="switchAuthView('login')">Hier einloggen</a>
        </div>
    </div>
        <script>
        function getAllUsers() { return JSON.parse(localStorage.getItem("sc_local_users") || "{}"); }
        function saveAllUsers(users) { localStorage.setItem("sc_local_users", JSON.stringify(users)); }

        // Hilfsfunktion: Gibt die eigene Geräte-ID zurück oder erstellt eine neue
        function getOrCreateDeviceId() {
            let devId = localStorage.getItem("sc_my_device_id");
            if (!devId) {
                devId = "DEV-" + Math.random().toString(36).substr(2, 9).toUpperCase();
                localStorage.setItem("sc_my_device_id", devId);
            }
            return devId;
        }

        function initSystem() {
            let users = getAllUsers();
            // Automatischen Owner Account erstellen, falls das System komplett leer ist
            if (Object.keys(users).length === 0) {
                users["Shadow"] = {
                    balance: 5000,
                    pass: "shadow-admin",
                    role: "Owner",
                    banned: false,
                    deviceId: getOrCreateDeviceId(),
                    browser: "Chrome/Safari (Owner)",
                    os: window.navigator.platform || "Unbekannt"
                };
                saveAllUsers(users);
            }
        }

        function switchAuthView(view) {
            if(view === 'register') {
                document.getElementById("login-view").style.display = "none";
                document.getElementById("register-view").style.display = "block";
            } else {
                document.getElementById("register-view").style.display = "none";
                document.getElementById("login-view").style.display = "block";
            }
        }

        function handleLogin() {
            // Sofortige Geräte-Bann-Prüfung
            let currentDevId = getOrCreateDeviceId();
            let bannedDevices = JSON.parse(localStorage.getItem("sc_banned_devices") || "[]");
            if (bannedDevices.includes(currentDevId)) { alert("Dieses Gerät wurde dauerhaft gesperrt! 🚫"); return; }

            const userIn = document.getElementById("login-username").value.trim();
            const passIn = document.getElementById("login-password").value;
            if(!userIn || !passIn) { alert("Bitte alle Felder ausfüllen!"); return; }
            
            let users = getAllUsers();
            if(!users[userIn]) { alert("Dieser Benutzername existiert nicht!"); return; }
            if(users[userIn].pass !== passIn) { alert("Falsches Passwort!"); return; }
                        // Zusätzliche Account-Bann-Prüfung bei Login
            if(users[userIn].banned) { alert("Dein Account wurde dauerhaft gesperrt! ❌"); return; }
            
            // Session-Informationen sichern
            localStorage.setItem("sc_username", userIn);
            localStorage.setItem("sc_password", users[userIn].pass);
            localStorage.setItem("sc_role", users[userIn].role || "Player");
            
            alert(`Willkommen zurück, ${userIn}!`);
            location.href = "index.html";
        }

        function handleRegister() {
            const userIn = document.getElementById("reg-username").value.trim();
            const passIn = document.getElementById("reg-password").value;
            
            if(!userIn || !passIn) { alert("Bitte fülle alle Felder aus!"); return; }
            if(userIn.length < 3) { alert("Der Name muss mindestens 3 Zeichen lang sein!"); return; }
            if(passIn.length < 4) { alert("Das Passwort muss mindestens 4 Zeichen lang sein!"); return; }
            
            let users = getAllUsers();
            if(users[userIn]) { alert("Dieser Benutzername ist leider schon vergeben!"); return; }
            
            // Browser- und Betriebssystem-Erkennung auslesen
            let userAgent = navigator.userAgent;
            let browserName = "Unbekannter Browser";
            if(userAgent.includes("Firefox")) browserName = "Firefox";
            else if(userAgent.includes("Chrome")) browserName = "Chrome";
            else if(userAgent.includes("Safari")) browserName = "Safari";
            else if(userAgent.includes("Edge")) browserName = "Edge";

            let platform = navigator.platform || "Unbekannt";
            if(userAgent.includes("Windows")) platform = "Windows";
            else if(userAgent.includes("Mac")) platform = "MacOS";
            else if(userAgent.includes("Linux")) platform = "Linux";
            else if(userAgent.includes("Android")) platform = "Android";
            else if(userAgent.includes("iPhone")) platform = "iOS";

            // Neuen User mit Hardware-Fingerabdruck anlegen
            users[userIn] = {
                balance: 1000,
                pass: passIn,
                role: "Player",
                banned: false,
                deviceId: getOrCreateDeviceId(),
                browser: browserName,
                os: platform
            };
            
            saveAllUsers(users);
            alert("Registrierung erfolgreich! Du kannst dich jetzt einloggen.");
            document.getElementById("reg-username").value = "";
            document.getElementById("reg-password").value = "";
            switchAuthView('login');
        }

        window.onload = function() { initSystem(); };
    </script>
</body>
</html>
