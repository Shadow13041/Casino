        <script>
        let balance = 1000; let currentU = ""; let userChoice = "heads"; let isFlipping = false; let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);

                else if (type === 'win') { osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); gain.gain.setValueAtTime(0.08, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); } 
                else if (type === 'lose') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, audioCtx.currentTime); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25); osc.start(); osc.stop(audioCtx.currentTime + 0.25); }
            } catch(e) {}

        window.onload = function() {

            document.getElementById("menu-username").innerText = currentU; const currentRole = localStorage.getItem("sc_role"); if (currentRole === "Owner" || currentRole === "Admin") { document.getElementById("admin-panel-link").style.display = "block"; }
            balance = parseInt(localStorage.getItem("sc_balance_" + currentU) || 1000); document.getElementById("balance-display").innerText = balance; syncFromCloud();

        function logout() { localStorage.removeItem("sc_username"); localStorage.removeItem("sc_role"); localStorage.removeItem("sc_password"); location.href = "login.html"; }
        async function syncFromCloud() {
            try {
                let firstPart = "https://api."; let secondPart = "://github.com"; let targetUrl = firstPart + secondPart + GH_USER + "/" + GH_REPO + "/contents/users.json";
                const res = await fetch(targetUrl, { headers: { "Authorization": "token " + GH_TOKEN, "Accept": "application/vnd.github.v3+json" } });

            } catch(e) {}
        }
        async function pushToCloud() {
            try {
                await syncFromCloud(); let opBracket = String.fromCharCode(91); let clBracket = String.fromCharCode(93); let fallbackEmptyArray = opBracket + clBracket;
                let userList = JSON.parse(localStorage.getItem("sc_global_users") || fallbackEmptyArray); let idx = userList.findIndex(u => u.username === currentU); if(idx !== -1) { userList.at(idx).balance = balance; }
                let b64 = btoa(unescape(encodeURIComponent(JSON.stringify(userList)))); let firstPart = "https://api."; let secondPart = "://github.com"; let targetUrl = firstPart + secondPart + GH_USER + "/" + GH_REPO + "/contents/users.json";
                await fetch(targetUrl, { method: "PUT", headers: { "Authorization": "token " + GH_TOKEN, "Content-Type": "application/json" }, body: JSON.stringify({ message: "Casino-Cloud: Coinflip-Update", content: b64, sha: currentFileSha }) });
            } catch(e) {}

        async function goBackToHub() { document.getElementById("flip-btn").disabled = true; document.getElementById("status-box").innerText = "⏳ Speichere Coins..."; await pushToCloud(); location.href = "index.html"; }
        function selectSide(side) { if (isFlipping) return; userChoice = side; document.getElementById("choose-heads-btn").classList.toggle("selected-heads", side === "heads"); document.getElementById("choose-tails-btn").classList.toggle("selected-tails", side === "tails"); }
        function startFlip() {
            if (isFlipping) return; let bet = parseInt(document.getElementById("bet-input").value); if (isNaN(bet) || bet <= 0 || bet > balance) { alert("Ungültiger Einsatz!"); return; }
            isFlipping = true; balance -= bet; document.getElementById("balance-display").innerText = balance; localStorage.setItem("sc_balance_" + currentU, balance);
            document.getElementById("flip-btn").disabled = true; document.getElementById("status-box").style.color = "#ffcc00"; document.getElementById("status-box").innerText = "Münze fliegt...";
            let cryptoArray = new Uint32Array(1); window.crypto.getRandomValues(cryptoArray); let finalResult = (cryptoArray.at(0) % 2 === 0) ? "heads" : "tails";
            let coinEl = document.getElementById("coin-element"); let rotation = 0; let ticks = 0;
            let interval = setInterval(() => {
                rotation += 180; coinEl.style.transform = "rotateX(" + rotation + "deg)"; playSound("tick");
                if (ticks % 2 === 0) { coinEl.className = "coin coin-tails"; coinEl.innerText = "🔵"; } else { coinEl.className = "coin coin-heads"; coinEl.innerText = "🔴"; }
                ticks++;
                if (ticks > 12) {
                    clearInterval(interval); coinEl.style.transform = "rotateX(0deg)";
                    if (finalResult === "heads") { coinEl.className = "coin coin-heads"; coinEl.innerText = "🔴"; } else { coinEl.className = "coin coin-tails"; coinEl.innerText = "🔵"; }
                    if (userChoice === finalResult) { balance += (bet * 2); document.getElementById("status-box").style.color = "#00ffcc"; document.getElementById("status-box").innerText = "🎉 GEWONNEN! +" + (bet * 2) + "$"; playSound("win"); } else { document.getElementById("status-box").style.color = "#ff0055"; document.getElementById("status-box").innerText = "❌ VERLOREN!"; playSound("lose"); }
                    document.getElementById("balance-display").innerText = balance; localStorage.setItem("sc_balance_" + currentU, balance); document.getElementById("flip-btn").disabled = false; isFlipping = false;
