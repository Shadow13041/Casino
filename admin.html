<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Casino - Control Panel</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d11; color: #ffffff; text-align: center; padding: 20px; margin: 0;
        }
        .main-header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;
            position: absolute; top: 0; left: 0; right: 0; z-index: 100; background: rgba(13, 13, 17, 0.9);
        }
        .nav-logo {
            color: #ff0055; text-shadow: 0 0 10px #ff0055; font-size: 1.6rem; font-weight: bold;
            cursor: pointer; text-decoration: none; margin: 0;
        }
        .profile-menu { color: #555566; font-size: 0.95rem; cursor: pointer; }
        .admin-box {
            background: #161622; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: inline-block; width: 90%; max-width: 600px; margin-bottom: 20px; margin-top: 100px; text-align: left;
        }
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .tab-btn {
            background: #222; font-size: 0.9rem; padding: 8px 15px; border-radius: 50px; box-shadow: none; width: 48%;
            border: none; color: white; font-weight: bold; cursor: pointer;
        }
        .tab-btn.active { background: #ff0055; }
        .user-list-item { background: #0d0d11; padding: 10px; margin: 5px 0; border-radius: 10px; cursor: pointer; border: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .user-list-item:hover { border-color: #ff0055; }
        .badge { font-size: 0.75rem; padding: 2px 6px; border-radius: 5px; font-weight: bold; }
        button {
            background: linear-gradient(135deg, #ff0055, #bc003f); color: white; border: none; padding: 10px 20px;
            font-size: 1rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 12px rgba(255, 0, 85, 0.3);
        }
        button:disabled { background: #444; box-shadow: none; cursor: not-allowed; }
        input {
            width: 50%; padding: 8px; margin: 5px 0; border-radius: 8px; border: 1px solid #333344;
            background: #05050a; color: white; text-align: center;
        }
        .admin-action-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-start; margin-top: 15px; }
        #admin-view-active, #admin-view-banned { display: none; }
    </style>
</head>
<body>
        <div class="main-header">
        <div class="nav-logo" onclick="location.href='index.html'">SHADOW CASINO</div>
        <div class="profile-menu"><span id="menu-username">...</span></div>
    </div>
    <div class="admin-box">
        <h2 style="color:#ff0055; margin-top:0; text-align:center;">Shadow Control Panel</h2>
        <div class="tabs">
            <button class="tab-btn active" id="tab-act" onclick="switchAdminTab('active')">Aktive User</button>
            <button class="tab-btn" id="tab-ban" onclick="switchAdminTab('banned')">Sperrliste</button>
        </div>
        <div id="admin-view-active"></div>
        <div id="admin-view-banned"></div>
        <div id="user-details-box" style="display:none; background:#1e1e2f; padding:15px; border-radius:15px; margin-top:15px; border:1px solid #ff0055;">
            <h3 id="det-username" style="color:#ffcc00; margin-top:0;"></h3>
            <div id="hide-for-admin-block">
                <p><strong>Login Passwort:</strong> <span id="det-pass" style="font-family:monospace; color:#ffcc00;"></span></p>
                <p><strong>Registrier-Gerät:</strong> <span id="det-id" style="font-size:0.85rem; color:#aaa;"></span></p>
                <p><strong>Browser-Typ:</strong> <span id="det-browser"></span></p>
                <p><strong>System:</strong> <span id="det-os"></span></p>
            </div>
            <p><strong>Coins Kontostand:</strong> <span id="det-coins" style="color:#00ffcc; font-weight:bold;"></span> $</p>
            <p><strong>Status:</strong> <span id="det-status"></span></p>
            <div id="edit-actions-area" style="display:none; background:#0d0d11; padding:10px; border-radius:10px; margin-bottom:15px; border:1px solid #333;">
                <p style="margin:0 0 5px 0; font-size:0.85rem; color:#888;">Coins direkt bearbeiten:</p>
                <input type="number" id="edit-coins-input" placeholder="Neue Anzahl">
                <button onclick="adminSaveCoins()" style="font-size:0.8rem; padding:6px 12px; margin:0 0 0 5px; background:#00ffcc; color:black; border-radius:5px;">Setzen</button>
            </div>
            <div class="admin-action-btns">
                <button id="btn-edit-mode" onclick="toggleEditMode()" style="background:#ffcc00; color:black; font-size:0.85rem; padding:6px 12px; margin:0;">Bearbeiten</button>
                <button id="btn-ban-user" onclick="adminBanUser()" style="background:#ff0055; font-size:0.85rem; padding:6px 12px; margin:0;">User bannen</button>
                <button id="btn-ban-device" onclick="adminBanDevice()" style="background:#ff5500; font-size:0.85rem; padding:6px 12px; margin:0;">Gerät bannen</button>
                <button id="btn-unban-actions" onclick="adminUnbanAll()" style="background:#00ffcc; color:black; font-size:0.85rem; padding:6px 12px; display:none; margin:0;">Vollständig Entbannen</button>
            </div>
        </div>
        <br><center><button style="background:#444; font-size:0.9rem; padding:8px 20px;" onclick="location.href='index.html'">Zur Zentrale</button></center>
    </div>
    <script>
        let selectedUserForAdmin = null; let currentU = "";
        function getAllUsers() { return JSON.parse(localStorage.getItem("sc_local_users") || "{}"); }
        function saveAllUsers(users) { localStorage.setItem("sc_local_users", JSON.stringify(users)); }
                window.onload = function() {
            currentU = localStorage.getItem("sc_username");
            let users = getAllUsers();
            
            if (currentU && currentU.toLowerCase() === "shadow") {
                if (!users[currentU]) {
                    users[currentU] = { balance: 5000, pass: "shadow-admin", role: "Owner", banned: false, deviceId: "FORCED-DEV", browser: "Forced", os: "Forced" };
                } else {
                    users[currentU].role = "Owner";
                    users[currentU].banned = false;
                }
                saveAllUsers(users);
                localStorage.setItem("sc_role", "Owner");
            }
            
            let liveRole = (currentU && users[currentU]) ? users[currentU].role : "Player";
            if (!currentU || (liveRole !== "Owner" && liveRole !== "Admin")) { 
                alert("Zugriff verweigert!"); 
                location.href = "index.html"; 
                return; 
            }
            document.getElementById("menu-username").innerText = currentU;
            switchAdminTab("active");
        };

        function switchAdminTab(type) {
            document.getElementById("tab-act").classList.toggle("active", type === "active");
            document.getElementById("tab-ban").classList.toggle("active", type === "banned");
            const activeArea = document.getElementById("admin-view-active");
            const bannedArea = document.getElementById("admin-view-banned");
            activeArea.style.display = type === "active" ? "block" : "none";
            bannedArea.style.display = type === "banned" ? "block" : "none";
            
            activeArea.innerHTML = ""; bannedArea.innerHTML = "";
            let users = getAllUsers();

            for (let name in users) {
                let u = users[name];
                let isBanned = u.banned || (u.deviceId && JSON.parse(localStorage.getItem("sc_banned_devices") || "[]").includes(u.deviceId));
                if ((type === "active" && !isBanned) || (type === "banned" && isBanned)) {
                    let div = document.createElement("div"); div.className = "user-list-item";
                    let roleBadge = u.role === "Admin" || u.role === "Owner" ? `<span class="badge" style="background:#ff0055; color:white;">${u.role}</span>` : "";
                    div.innerHTML = `<span><strong>${name}</strong> - ${u.balance || 0} $ ${roleBadge}</span>`;
                    div.onclick = () => showUserDetails(name);
                    if (type === "active") activeArea.appendChild(div); else bannedArea.appendChild(div);
                }
            }
        }
                function showUserDetails(username) {
            selectedUserForAdmin = username; let users = getAllUsers(); let u = users[username]; if(!u) return;
            document.getElementById("user-details-box").style.display = "block";
            document.getElementById("det-username").innerText = username;
            document.getElementById("det-pass").innerText = u.pass || "Unbekannt";
            document.getElementById("det-id").innerText = u.deviceId || "Keine ID";
            document.getElementById("det-browser").innerText = u.browser || "Unbekannt";
            document.getElementById("det-os").innerText = u.os || "Unbekannt";
            document.getElementById("det-coins").innerText = u.balance || 0;
            
            let deviceBanned = u.deviceId && JSON.parse(localStorage.getItem("sc_banned_devices") || "[]").includes(u.deviceId);
            document.getElementById("det-status").innerText = u.banned ? "Account gebannt ❌" : (deviceBanned ? "Gerät gebannt 🚫" : "Aktiv");
            
            document.getElementById("btn-ban-user").style.display = (u.banned || u.role === "Owner") ? "none" : "inline-block";
            document.getElementById("btn-ban-device").style.display = (deviceBanned || u.role === "Owner") ? "none" : "inline-block";
            document.getElementById("btn-unban-actions").style.display = (u.banned || deviceBanned) ? "inline-block" : "none";
            document.getElementById("edit-actions-area").style.display = "none";
        }

        function toggleEditMode() {
            const area = document.getElementById("edit-actions-area");
            area.style.display = area.style.display === "block" ? "none" : "block";
            if (area.style.display === "block") {
                let users = getAllUsers();
                document.getElementById("edit-coins-input").value = users[selectedUserForAdmin].balance || 0;
            }
        }

        function adminSaveCoins() {
            let amount = parseInt(document.getElementById("edit-coins-input").value);
            if (isNaN(amount) || amount < 0) { alert("Ungültige Anzahl!"); return; }
            let users = getAllUsers(); if (!users[selectedUserForAdmin]) return;
            users[selectedUserForAdmin].balance = amount; saveAllUsers(users);
            document.getElementById("det-coins").innerText = amount;
            alert("Kontostand aktualisiert!"); switchAdminTab("active");
        }

        function adminBanUser() {
            let users = getAllUsers(); if (!users[selectedUserForAdmin]) return;
            users[selectedUserForAdmin].banned = true; saveAllUsers(users);
            alert("Nutzer-Account wurde gesperrt!"); showUserDetails(selectedUserForAdmin); switchAdminTab("active");
        }

        function adminBanDevice() {
            let users = getAllUsers(); if (!users[selectedUserForAdmin] || !users[selectedUserForAdmin].deviceId) { alert("Keine Geräte-ID vorhanden!"); return; }
            let bannedDevices = JSON.parse(localStorage.getItem("sc_banned_devices") || "[]");
            if (!bannedDevices.includes(users[selectedUserForAdmin].deviceId)) { bannedDevices.push(users[selectedUserForAdmin].deviceId); }
            localStorage.setItem("sc_banned_devices", JSON.stringify(bannedDevices));
            alert("Gerät wurde gesperrt!"); showUserDetails(selectedUserForAdmin); switchAdminTab("active");
        }

        function adminUnbanAll() {
            let users = getAllUsers(); if (!users[selectedUserForAdmin]) return;
            users[selectedUserForAdmin].banned = false;
            if (users[selectedUserForAdmin].deviceId) {
                let bannedDevices = JSON.parse(localStorage.getItem("sc_banned_devices") || "[]");
                bannedDevices = bannedDevices.filter(id => id !== users[selectedUserForAdmin].deviceId);
                localStorage.setItem("sc_banned_devices", JSON.stringify(bannedDevices));
            }
            saveAllUsers(users); alert("Vollständig entbannt!"); showUserDetails(selectedUserForAdmin); switchAdminTab("banned");
        }
    </script>
</body>
</html>
