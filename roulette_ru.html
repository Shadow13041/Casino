<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch Roulette - Shadow Casino</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d11; color: #ffffff; text-align: center; padding: 20px; margin: 0;
        }
        .main-header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;
            position: absolute; top: 0; left: 0; right: 0; z-index: 100; background: rgba(13, 13, 17, 0.9);
        }
        .nav-logo {
            color: #ff0055; text-shadow: 0 0 10px #ff0055; font-size: 1.6rem; font-weight: bold;
            cursor: pointer; text-decoration: none; margin: 0;
        }
        .profile-menu {
            color: #555566; font-size: 0.95rem; cursor: pointer; text-align: right; position: relative;
        }
        .profile-menu:hover { color: #888899; }
          /* =============== START BLOCK 2 =============== */
        .dropdown-content {
            display: none; background: #161622; border: 1px solid #333344; padding: 10px; border-radius: 10px;
            position: absolute; right: 0; top: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 120px; z-index: 200;
        }
        .dropdown-content a { color: #ff0055; text-decoration: none; display: block; margin: 5px 0; font-size: 0.85rem; }
        .game-container {
            background: #161622; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: inline-block; width: 90%; max-width: 420px; margin-top: 100px; text-align: center;
        }
        .barrel-display {
            background: #05050a; border: 4px solid #ff0055; width: 120px; height: 120px; line-height: 120px;
            font-size: 3rem; font-weight: bold; border-radius: 50%; margin: 25px auto;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.3); transition: transform 0.3s ease;
        }
        button {
            background: linear-gradient(135deg, #ff0055, #bc003f); color: white; border: none; padding: 12px 25px;
            font-size: 1.1rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
            margin: 5px;
          }
        /* =============== START BLOCK 3 =============== */
        button:disabled { background: #444; box-shadow: none; cursor: not-allowed; }
        .cashout-btn { background: linear-gradient(135deg, #00ffcc, #00b38f); color: #0d0d11; box-shadow: none; }
        input {
            width: 60%; padding: 10px; margin: 10px 0; border-radius: 10px; border: 1px solid #333344;
            background: #05050a; color: white; text-align: center; font-size: 1rem;
        }
        .status-text { font-size: 1.1rem; color: #ffcc00; font-weight: bold; margin-top: 15px; height: 25px; }
    </style>
</head>
<body>
    <div class="main-header">
        <div class="nav-logo" onclick="location.href='index.html'">SHADOW CASINO</div>
        <div class="profile-menu">
            <span onclick="toggleDropdown()" id="menu-username">Benutzer</span>
            <div id="profile-dropdown" class="dropdown-content">
                <a href="admin.html" id="admin-panel-link" style="display:none; font-weight:bold; color:#00ffcc;">⚙️ Admin Panel</a>
                <a href="index.html">🏠 Zentrale</a>
                <a href="#" onclick="logout()">Abmelden</a>
            </div>
        </div>
    </div>
<!-- =============== START BLOCK 4 =============== -->
    <div class="game-container">
        <h2 style="color:#ff0055; margin-top:0;">💀 Russisch Roulette</h2>
        <p style="color:#888; font-size:0.9rem; margin-bottom:5px;">Überlebe die Kammern für maximale Multiplikatoren. Jedes Abdrücken erhöht das Risiko!</p>
        <div style="font-size: 0.95rem; color: #aaa; margin-bottom: 15px;">Kontostand: <span id="coins-display" style="color:#00ffcc; font-weight:bold;">0</span> $</div>
        
        <div id="setup-area">
            <input type="number" id="bet-input" placeholder="Einsatz in $" value="50"><br>
            <button onclick="startGame()">Trommel drehen & laden</button>
        </div>
        <div id="play-area" style="display: none;">
            <div style="font-size:0.9rem; color:#aaa;">Aktueller Gewinn: <span id="potential-win" style="color:#00ffcc; font-weight:bold;">0</span> $ (<span id="mult-display" style="color:#00ffcc; font-weight:bold;">1.0x</span>)</div>
            <div style="font-size:0.85rem; color:#888; margin-top:5px;">Überlebte Schüsse: <span id="shot-display" style="color:#ffcc00; font-weight:bold;">0</span> / 5</div>
            <div class="barrel-display" id="barrel-box">📁</div>
            <button id="trigger-btn" onclick="pullTrigger()">💥 Abdrücken</button>
            <button class="cashout-btn" id="cash-btn" onclick="cashout()">💵 Coins sichern</button>
        </div>
        <div class="status-text" id="status-box">Setze deinen Einsatz!</div>
    </div>
              <!-- =============== START BLOCK 5 =============== -->
    <script>
        let bet = 0; let currentMultiplier = 1.0; let streak = 0; let bulletLocation = 0; let currentShot = 1;
        let currentU = ""; let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === "click") { osc.type = "triangle"; osc.frequency.setValueAtTime(800, audioCtx.currentTime); gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03); osc.start(); osc.stop(audioCtx.currentTime + 0.03); } 
                else if (type === "boom") { osc.type = "sawtooth"; osc.frequency.setValueAtTime(100, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.5); gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5); }
                else if (type === "cash") { osc.type = "sine"; osc.frequency.setValueAtTime(600, audioCtx.currentTime); osc.frequency.setValueAtTime(900, audioCtx.currentTime + 0.08); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25); osc.start(); osc.stop(audioCtx.currentTime + 0.25); }
            } catch(e) {}
        }

        window.onload = function() {
            currentU = localStorage.getItem("sc_username"); if (!currentU) { location.href = "login.html"; return; }
            document.getElementById("menu-username").innerText = currentU;
            const currentRole = localStorage.getItem("sc_role");
            if (currentRole === "Owner" || currentRole === "Admin") { document.getElementById("admin-panel-link").style.display = "block"; }
            updateBalanceDisplay();
        };

        function updateBalanceDisplay() { document.getElementById("coins-display").innerText = localStorage.getItem("sc_balance_" + currentU) || 1000; }
        function toggleDropdown() { const drop = document.getElementById("profile-dropdown"); drop.style.display = drop.style.display === "block" ? "none" : "block"; }
        function logout() { localStorage.removeItem("sc_username"); localStorage.removeItem('sc_role'); localStorage.removeItem('sc_password'); location.href = "login.html"; }

        async function pushToCloud() {
            try {
                let userList = JSON.parse(localStorage.getItem("sc_global_users") || "[]");
                userList.forEach(u => { u.balance = parseInt(localStorage.getItem("sc_balance_" + u.username) || 1000); });
                await fetch("https://kvdb.io", { method: "PUT", body: JSON.stringify(userList) });
            } catch(e) {}
        }

        function startGame() {
            bet = parseInt(document.getElementById("bet-input").value);
            let coins = parseInt(localStorage.getItem("sc_balance_" + currentU) || 1000);
            if (isNaN(bet) || bet <= 0 || bet > coins) { alert("Ungültiger Einsatz!"); return; }
            
            coins -= bet; localStorage.setItem("sc_balance_" + currentU, coins); updateBalanceDisplay(); pushToCloud();
            
            bulletLocation = Math.floor(Math.random() * 6) + 1; // Kugel liegt in Kammer 1 bis 6
            currentShot = 1; currentMultiplier = 1.0; streak = 0;
            
            document.getElementById("setup-area").style.display = "none"; document.getElementById("play-area").style.display = "block";
            document.getElementById("barrel-box").innerText = "📁"; document.getElementById("barrel-box").style.transform = "rotate(0deg)";
            document.getElementById("status-box").style.color = "#ffcc00"; document.getElementById("status-box").innerText = "Kammer 1 ist bereit. Drückst du ab?";
            updateStats();
        }

        function pullTrigger() {
            document.getElementById("trigger-btn").disabled = true;
            document.getElementById("barrel-box").style.transform = "rotate(" + (currentShot * 60) + "deg)";
            
            setTimeout(() => {
                if (currentShot === bulletLocation) {
                    playSound("boom"); document.getElementById("barrel-box").innerText = "💥";
                    document.getElementById("status-box").style.color = "#ff0055"; document.getElementById("status-box").innerText = "KUGEL GETROFFEN! Totalschaden in Kammer " + currentShot + "!";
                    setTimeout(resetGame, 2500);
                } else {
                    playSound("click"); document.getElementById("barrel-box").innerText = "🔒";
                    streak++;
                    // Multiplikator steigt mit jedem überlebten Schuss steil an
                    if(streak === 1) currentMultiplier = 1.2;
                    else if(streak === 2) currentMultiplier = 1.5;
                    else if(streak === 3) currentMultiplier = 2.0;
                    else if(streak === 4) currentMultiplier = 3.0;
                    else if(streak === 5) currentMultiplier = 5.5;
                    
                    document.getElementById("status-box").style.color = "#00ffcc"; document.getElementById("status-box").innerText = "Klick! Kammer " + currentShot + " war leer. Glück gehabt!";
                    currentShot++; updateStats(); document.getElementById("trigger-btn").disabled = false;
                    
                    if (streak === 5) { alert("Überlebenskünstler! Du hast alle leeren Kammern überstanden!"); cashout(); }
                }
            }, 300);
        }

        function updateStats() {
            document.getElementById("shot-display").innerText = streak;
            document.getElementById("mult-display").innerText = currentMultiplier.toFixed(2) + "x";
            document.getElementById("potential-win").innerText = Math.floor(bet * currentMultiplier);
        }

        function cashout() {
            let coins = parseInt(localStorage.getItem("sc_balance_" + currentU) || 1000);
            let totalWin = Math.floor(bet * currentMultiplier); coins += totalWin;
            localStorage.setItem("sc_balance_" + currentU, coins); playSound("cash"); pushToCloud();
            alert("Erfolgreich zurückgezogen. +" + totalWin + "$ gesichert!"); resetGame();
        }

        function resetGame() {
            updateBalanceDisplay(); document.getElementById("setup-area").style.display = "block"; document.getElementById("play-area").style.display = "none";
            document.getElementById("status-box").style.color = "#ffcc00"; document.getElementById("status-box").innerText = "Setze deinen Einsatz!";
            document.getElementById("trigger-btn").disabled = false;
        }
    </script>
</body>
</html>
