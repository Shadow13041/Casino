<body>

        let ghost1 = { x: 18, y: 17, dx: -1, dy: 0 };

            } catch(e) {}

        window.onload = function() {

                async function syncFromCloud() {

                let firstPart = "https://api."; let secondPart = "://github.com"; let targetUrl = firstPart + secondPart + GH_USER + "/" + GH_REPO + "/contents/users.json";
                const res = await fetch(targetUrl, { headers: { "Authorization": "token " + GH_TOKEN, "Accept": "application/vnd.github.v3+json" } });
                if(res.ok) { const data = await res.json(); currentFileSha = data.sha; let text = decodeURIComponent(escape(atob(data.content))); localStorage.setItem("sc_global_users", text); }
            } catch(e) {}

        async function pushToCloud() {

                let b64 = btoa(unescape(encodeURIComponent(JSON.stringify(userList)))); let firstPart = "https://api."; let secondPart = "://github.com"; let targetUrl = firstPart + secondPart + GH_USER + "/" + GH_REPO + "/contents/users.json";
                await fetch(targetUrl, { method: "PUT", headers: { "Authorization": "token " + GH_TOKEN, "Content-Type": "application/json" }, body: JSON.stringify({ message: "Casino-Cloud: Pacman-Update", content: b64, sha: currentFileSha }) });
            } catch(e) {}
        }
        function changeDir(x, y) { pacman.nextDx = x; pacman.nextDy = y; }
        function startPacman() {
            bet = parseInt(document.getElementById("bet-input").value); let coins = parseInt(localStorage.getItem("sc_balance_" + currentU) || 1000); if (isNaN(bet) || bet <= 0 || bet > coins) { alert("Ungültiger Einsatz!"); return; }
            coins -= bet; localStorage.setItem("sc_balance_" + currentU, coins); updateBalanceDisplay(); pushToCloud();
            document.getElementById("setup-area").style.display = "none"; document.getElementById("play-area").style.display = "block"; document.getElementById("status-box").style.color = "#ffcc00"; document.getElementById("status-box").innerText = "Weiche den Geistern aus!";
            grid = JSON.parse(JSON.stringify(mapStr)); pacman = { x: 1, y: 1, dx: 1, dy: 0, nextDx: 1, nextDy: 0 }; ghost1 = { x: 18, y: 17, dx: -1, dy: 0 }; ghost2 = { x: 1, y: 17, dx: 1, dy: 0 }; recentTurns = []; currentMultiplier = 1.0; gameActive = true;
            if(gameInterval) clearInterval(gameInterval); gameInterval = setInterval(gameLoop, 220);
        }
        function moveGhost(g, id) {
            let possibleMoves = [];
            if (grid.at(g.y - 1).at(g.x) !== 1) possibleMoves.push({x:0, y:-1});
            if (grid.at(g.y + 1).at(g.x) !== 1) possibleMoves.push({x:0, y:1});
            if (grid.at(g.y).at(g.x - 1) !== 1) possibleMoves.push({x:-1, y:0});
            if (grid.at(g.y).at(g.x + 1) !== 1) possibleMoves.push({x:1, y:0});

                if (possibleMoves.length > 1 && m.x === -g.dx && m.y === -g.dy) return;
                validMoves.push(m);
            });
            let now = Date.now();
            recentTurns = recentTurns.filter(t => now - t.time < 5000);
            if (validMoves.length >= 2) {
                let filteredMoves = validMoves.filter(m => {
                    return !recentTurns.some(t => t.id !== id && t.x === g.x && t.y === g.y && t.dx === m.x && t.dy === m.y);
                });
                if (filteredMoves.length > 0) validMoves = filteredMoves;
            }
                        if (validMoves.length > 0) {
                let cryptoArray = new Uint32Array(1); window.crypto.getRandomValues(cryptoArray); let aiRoll = (cryptoArray.at(0) % 100) + 1; let chosenMove;
                if (aiRoll <= 10) { let randIndex = cryptoArray.at(0) % validMoves.length; chosenMove = validMoves.at(randIndex); } else {
                    chosenMove = validMoves.at(0); let minDist = 9999;

                }
                if (g.dx !== chosenMove.x || g.dy !== chosenMove.y) { recentTurns.push({ id: id, x: g.x, y: g.y, dx: chosenMove.x, dy: chosenMove.y, time: now }); }
                g.dx = chosenMove.x; g.dy = chosenMove.y;

                let fallbackMove = possibleMoves.at(0); g.dx = fallbackMove.x; g.dy = fallbackMove.y;
            }
            g.x += g.dx; g.y += g.dy;
        }
        function gameLoop() {
            if (!gameActive) return;
            if (grid.at(pacman.y + pacman.nextDy).at(pacman.x + pacman.nextDx) !== 1) { pacman.dx = pacman.nextDx; pacman.dy = pacman.nextDy; }
            if (grid.at(pacman.y + pacman.dy).at(pacman.x + pacman.dx) !== 1) { pacman.x += pacman.dx; pacman.y += pacman.dy; }
            if (grid.at(pacman.y).at(pacman.x) === 0) { grid.at(pacman.y).splice(pacman.x, 1, 2); currentMultiplier += 0.05; playSound("waka"); document.getElementById("mult-display").innerText = currentMultiplier.toFixed(2) + "x"; document.getElementById("potential-win").innerText = Math.floor(bet * currentMultiplier); }
            moveGhost(ghost1, 1); moveGhost(ghost2, 2);
            if ((pacman.x === ghost1.x && pacman.y === ghost1.y) || (pacman.x === ghost2.x && pacman.y === ghost2.y)) { gameOver(); return; }
            ctx.fillStyle = "#05050a"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            for(let r = 0; r < rows; r++) { for(let c = 0; c < cols; c++) { if (grid.at(r).at(c) === 1) { ctx.fillStyle = "#161622"; ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize); } else if (grid.at(r).at(c) === 0) { ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(c * tileSize + tileSize/2, r * tileSize + tileSize/2, 2, 0, Math.PI * 2); ctx.fill(); } } }
            ctx.fillStyle = "#ffcc00"; ctx.beginPath(); ctx.arc(pacman.x * tileSize + tileSize/2, pacman.y * tileSize + tileSize/2, tileSize/2 - 2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#ff0055"; ctx.beginPath(); ctx.arc(ghost1.x * tileSize + tileSize/2, ghost1.y * tileSize + tileSize/2, tileSize/2 - 2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#00ffcc"; ctx.beginPath(); ctx.arc(ghost2.x * tileSize + tileSize/2, ghost2.y * tileSize + tileSize/2, tileSize/2 - 2, 0, Math.PI * 2); ctx.fill();
