<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Pacman - Shadow Casino</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d11; color: #ffffff; text-align: center; padding: 15px; margin: 0;
        }
        .main-header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;
            position: absolute; top: 0; left: 0; right: 0; z-index: 100; background: rgba(13, 13, 17, 0.9);
        }
        .nav-logo {
            color: #ff0055; text-shadow: 0 0 10px #ff0055; font-size: 1.6rem; font-weight: bold;
            cursor: pointer; text-decoration: none; margin: 0;
        }
        .profile-menu {
            color: #555566; font-size: 0.95rem; cursor: pointer; text-align: right; position: relative;
        }
        .profile-menu:hover { color: #888899; }
        .dropdown-content {
            display: none; background: #161622; border: 1px solid #333344; padding: 10px; border-radius: 10px;
            position: absolute; right: 0; top: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 120px; z-index: 200;
        }
        .dropdown-content a { color: #ff0055; text-decoration: none; display: block; margin: 5px 0; font-size: 0.85rem; }
        .game-container {
            background: #161622; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: inline-block; width: 95%; max-width: 440px; margin-top: 85px; text-align: center; box-sizing: border-box;
        }
        canvas {
            background: #05050a; border: 3px solid #ff0055; display: block; margin: 15px auto; border-radius: 15px;
            width: 280px !important; height: 266px !important; box-sizing: border-box;
        }
        .controls-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 180px; margin: 15px auto;
        }
        button {
            background: linear-gradient(135deg, #ff0055, #bc003f); color: white; border: none; padding: 12px 25px;
            font-size: 1rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 12px rgba(255, 0, 85, 0.3); outline: none;
        }
        button:disabled { background: #444 !important; box-shadow: none !important; cursor: not-allowed; color: #888; }
        .btn-ctrl { background: #1e1e2f; border: 2px solid #333344; font-size: 1.4rem; padding: 10px; border-radius: 12px; box-shadow: none; }
        .btn-ctrl:hover { border-color: #ff0055; }
        .cashout-btn { background: linear-gradient(135deg, #00ffcc, #00b38f); color: #0d0d11; box-shadow: none; width: 80%; }
        input {
            width: 70%; padding: 10px; margin: 6px 0; border-radius: 10px; border: 1px solid #333344;
            background: #05050a; color: white; text-align: center; font-size: 1rem; outline: none;
        }
        .status-text { font-size: 1.1rem; color: #ffcc00; font-weight: bold; margin-top: 10px; height: 25px; }
    </style>
</head>
<body>
    <div class="main-header">
        <div class="nav-logo" onclick="location.href='index.html'">SHADOW CASINO</div>
        <div class="profile-menu">
            <span onclick="toggleDropdown()" id="menu-username">Benutzer</span>
            <div id="profile-dropdown" class="dropdown-content">
                <a href="admin.html" id="admin-panel-link" style="display:none; font-weight:bold; color:#00ffcc;">⚙️ Admin Panel</a>
                <a href="index.html">🏠 Zentrale</a>
                <a href="#" onclick="logout()">Abmelden</a>
            </div>
        </div>
    </div>
    <div class="game-container">
        <h2 style="color:#ff0055; margin-top:0; font-size:1.6rem;">👾 Shadow Pacman</h2>
        <p style="color:#888; font-size:0.85rem; margin-bottom:5px;">Zwei Geister jagen dich im Team! Weiche ihnen geschickt im Labyrinth aus.</p>
        <div style="font-size: 0.9rem; color: #aaa; margin-bottom: 10px;">Guthaben: <span id="coins-display" style="color:#00ffcc; font-weight:bold;">0</span> $</div>
        
        <div id="setup-area">
            <input type="number" id="bet-input" placeholder="Einsatz in $" value="50"><br>
            <button onclick="startPacman()">Runde starten</button>
        </div>
        
        <div id="play-area" style="display: none;">
            <div style="font-size:0.9rem; color:#aaa;">Multiplikator: <span id="mult-display" style="color:#00ffcc; font-weight:bold;">1.00x</span> | Gewinn: <span id="potential-win" style="color:#00ffcc; font-weight:bold;">0</span> $</div>
            <canvas id="pacmanCanvas" width="280" height="266"></canvas>
            <div class="controls-grid">
                <div></div><button class="btn-ctrl" onclick="changeDir(0, -1)">🔼</button><div></div>
                <button class="btn-ctrl" onclick="changeDir(-1, 0)">◀️</button><div></div><button class="btn-ctrl" onclick="changeDir(1, 0)">▶️</button>
                <div></div><button class="btn-ctrl" onclick="changeDir(0, 1)">🔽</button><div></div>
            </div>
            <button class="cashout-btn" onclick="cashoutPacman()">💵 Profit auszahlen</button>
        </div>
        <div class="status-text" id="status-box">Platziere deinen Casino-Einsatz!</div>
    </div>

    <script>
        let bet = 0; let currentU = ""; let audioCtx = null;
        let canvas, ctx, gameInterval; let gameActive = false; let currentMultiplier = 1.0;
        let mapStr = "11111111111111111111|10000100000000100001|10110101111110101101|10000000010000000001|11101111010111101111|10001000010000100001|10101011111110101011|10100000000000001011|10111110111110111111|10000000111110000001|10111110111110111111|10100000000000001011|10101011111110101011|10001000010000100001|11101111010111101111|10000000010000000001|10110101111110101101|10000100000000100001|11111111111111111111".split("|").map(row => row.split("").map(Number));
        let grid = []; let rows = 19; let cols = 20; let tileSize = 14;
        let pacman = { x: 1, y: 1, dx: 1, dy: 0, nextDx: 1, nextDy: 0 };
        let ghost1 = { x: 18, y: 17, dx: -1, dy: 0 };
        let ghost2 = { x: 1, y: 17, dx: 1, dy: 0 };

        function getAllUsers() { return JSON.parse(localStorage.getItem("sc_local_users") || "{}"); }
        function saveAllUsers(users) { localStorage.setItem("sc_local_users", JSON.stringify(users)); }

        function playSound(type) {
            try {
                if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'waka') { osc.type = 'sine'; osc.frequency.setValueAtTime(440, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08); gain.gain.setValueAtTime(0.04, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08); osc.start(); osc.stop(audioCtx.currentTime + 0.08); } 
                else if (type === 'death') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.5); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5); }
                else if (type === 'cash') { osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); gain.gain.setValueAtTime(0.08, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25); osc.start(); osc.stop(audioCtx.currentTime + 0.25); }
            } catch(e) {}
        }

        window.onload = function() {
            currentU = localStorage.getItem("sc_username"); if (!currentU) { location.href = "login.html"; return; }
            document.getElementById("menu-username").innerText = currentU;
            let users = getAllUsers(); if(!users[currentU]) { logout(); return; }
            const currentRole = users[currentU].role || "Player";
            if (currentRole === "Owner" || currentRole === "Admin") { document.getElementById("admin-panel-link").style.display = "block"; }
            updateBalanceDisplay();
            canvas = document.getElementById("pacmanCanvas"); ctx = canvas.getContext("2d");
            window.addEventListener("keydown", (e) => {
                if (!gameActive) return;
                if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") changeDir(0, -1);
                if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") changeDir(0, 1);
                if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") changeDir(-1, 0);
                if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") changeDir(1, 0);
            });
        };
        function updateBalanceDisplay() { let users = getAllUsers(); document.getElementById("coins-display").innerText = users[currentU] ? users[currentU].balance : 1000; }
        function toggleDropdown() { const drop = document.getElementById("profile-dropdown"); drop.style.display = drop.style.display === "block" ? "none" : "block"; }
        function logout() { localStorage.clear(); location.href = "login.html"; }
                function startPacman() {
            let users = getAllUsers(); bet = parseInt(document.getElementById("bet-input").value);
            if (isNaN(bet) || bet <= 0 || bet > users[currentU].balance) { alert("Ungültiger Einsatz!"); return; }
            users[currentU].balance -= bet; saveAllUsers(users); updateBalanceDisplay();
            grid = JSON.parse(JSON.stringify(mapStr)); currentMultiplier = 1.0; gameActive = true;
            pacman = { x: 1, y: 1, dx: 1, dy: 0, nextDx: 1, nextDy: 0 };
            ghost1 = { x: 18, y: 17, dx: -1, dy: 0 }; ghost2 = { x: 1, y: 17, dx: 1, dy: 0 };
            document.getElementById("setup-area").style.display = "none"; document.getElementById("play-area").style.display = "block";
            document.getElementById("status-box").style.color = "#ffcc00"; document.getElementById("status-box").innerText = "Weiche den Geistern aus!";
            updateStats(); gameInterval = setInterval(updateGame, 200);
        }

        function changeDir(x, y) { pacman.nextDx = x; pacman.nextDy = y; }
        function isWalkable(x, y) { if (x < 0 || x >= cols || y < 0 || y >= rows) return false; return grid[y][x] !== 1; }

        function moveGhost(ghost) {
            let dirs = [{x: 1, y: 0}, {x: -1, y: 0}, {x: 0, y: 1}, {x: 0, y: -1}];
            let validDirs = dirs.filter(d => isWalkable(ghost.x + d.x, ghost.y + d.y) && (d.x !== -ghost.dx || d.y !== -ghost.dy));
            if (validDirs.length === 0) validDirs = dirs.filter(d => isWalkable(ghost.x + d.x, ghost.y + d.y));
            if (validDirs.length > 0) {
                validDirs.sort((a, b) => {
                    let distA = Math.abs((ghost.x + a.x) - pacman.x) + Math.abs((ghost.y + a.y) - pacman.y);
                    let distB = Math.abs((ghost.x + b.x) - pacman.x) + Math.abs((ghost.y + b.y) - pacman.y);
                    return distA - distB;
                });
                ghost.x += validDirs[0].x; ghost.y += validDirs[0].y; ghost.dx = validDirs[0].x; ghost.dy = validDirs[0].y;
            }
        }

        function updateGame() {
            if (!gameActive) return;
            if (isWalkable(pacman.x + pacman.nextDx, pacman.y + pacman.nextDy)) { pacman.dx = pacman.nextDx; pacman.dy = pacman.nextDy; }
            if (isWalkable(pacman.x + pacman.dx, pacman.y + pacman.dy)) { pacman.x += pacman.dx; pacman.y += pacman.dy; }
            if (grid[pacman.y][pacman.x] === 0) { grid[pacman.y][pacman.x] = 2; currentMultiplier += 0.05; playSound('waka'); updateStats(); }
            moveGhost(ghost1); moveGhost(ghost2);
            if ((pacman.x === ghost1.x && pacman.y === ghost1.y) || (pacman.x === ghost2.x && pacman.y === ghost2.y)) {
                gameActive = false; clearInterval(gameInterval); playSound('death');
                document.getElementById("status-box").style.color = "#ff0055"; document.getElementById("status-box").innerText = "Gefangen! ❌";
                setTimeout(resetPacmanGame, 3000);
            }
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (grid[r][c] === 1) { ctx.fillStyle = "#333344"; ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize); }
                    else if (grid[r][c] === 0) { ctx.fillStyle = "#ffcc00"; ctx.beginPath(); ctx.arc(c * tileSize + tileSize/2, r * tileSize + tileSize/2, 2.5, 0, Math.PI * 2); ctx.fill(); }
                }
            }
            ctx.fillStyle = "#ffcc00"; ctx.beginPath(); ctx.arc(pacman.x * tileSize + tileSize/2, pacman.y * tileSize + tileSize/2, tileSize/2 - 1, 0.2 * Math.PI, 1.8 * Math.PI); ctx.lineTo(pacman.x * tileSize + tileSize/2, pacman.y * tileSize + tileSize/2); ctx.fill();
            ctx.fillStyle = "#ff0055"; ctx.fillRect(ghost1.x * tileSize + 1, ghost1.y * tileSize + 1, tileSize - 2, tileSize - 2);
            ctx.fillStyle = "#00ffcc"; ctx.fillRect(ghost2.x * tileSize + 1, ghost2.y * tileSize + 1, tileSize - 2, tileSize - 2);
        }

        function updateStats() { document.getElementById("mult-display").innerText = currentMultiplier.toFixed(2) + "x"; document.getElementById("potential-win").innerText = Math.floor(bet * currentMultiplier); }
        
        function cashoutPacman() {
            if (!gameActive) return; gameActive = false; clearInterval(gameInterval);
            let users = getAllUsers(); let totalWin = Math.floor(bet * currentMultiplier);
            users[currentU].balance += totalWin; saveAllUsers(users); playSound('cash');
            document.getElementById("status-box").style.color = "#00ffcc"; document.getElementById("status-box").innerText = `Profit gesichert! +${totalWin} $ 🏆`;
            setTimeout(resetPacmanGame, 3000);
        }

        function resetPacmanGame() { clearInterval(gameInterval); gameActive = false; updateBalanceDisplay(); document.getElementById("setup-area").style.display = "block"; document.getElementById("play-area").style.display = "none"; document.getElementById("status-box").style.color = "#ffcc00"; document.getElementById("status-box").innerText = "Platziere deinen Casino-Einsatz!"; }
    </script>
</body>
</html>
