<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slots 3x1 - Shadow Casino</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d11; color: #ffffff; text-align: center; padding: 20px; margin: 0;
        }
        .main-header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;
            position: absolute; top: 0; left: 0; right: 0; z-index: 100; background: rgba(13, 13, 17, 0.9);
        }
        .nav-logo {
            color: #ff0055; text-shadow: 0 0 10px #ff0055; font-size: 1.6rem; font-weight: bold;
            cursor: pointer; text-decoration: none; margin: 0;
        }
        .profile-menu {
            color: #555566; font-size: 0.95rem; cursor: pointer; text-align: right; position: relative;
        }
        .profile-menu:hover { color: #888899; }
                /* =============== START BLOCK 2 =============== */
        .dropdown-content {
            display: none; background: #161622; border: 1px solid #333344; padding: 10px; border-radius: 10px;
            position: absolute; right: 0; top: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 120px; z-index: 200;
        }
        .dropdown-content a { color: #ff0055; text-decoration: none; display: block; margin: 5px 0; font-size: 0.85rem; }
        .game-container {
            background: #161622; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: inline-block; width: 95%; max-width: 440px; margin-top: 100px; text-align: center;
        }
        .slot-machine {
            background: linear-gradient(145deg, #1e1e2f, #12121f); border: 4px solid #ff0055; border-radius: 25px;
            padding: 25px 15px; display: inline-block; box-shadow: 0 0 30px rgba(255, 0, 85, 0.25); margin-bottom: 10px; width: 100%; box-sizing: border-box;
        }
        .slots-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px;
            background: #05050a; padding: 15px; border-radius: 15px; box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
        }
        .slot-cell {
            background: #11111a; height: 90px; line-height: 90px; font-size: 3rem;
            border-radius: 12px; border: 1px solid #333344; transition: transform 0.1s;
        }
        button {
            background: linear-gradient(135deg, #ff0055, #bc003f); color: white; border: none; padding: 12px 35px;
            font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
        }
        button:disabled { background: #444; box-shadow: none; cursor: not-allowed; }
        .message { font-size: 1.1rem; height: 30px; color: #ffcc00; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<!-- =============== START BLOCK 3 =============== -->
<body>
    <div class="main-header">
        <div class="nav-logo" onclick="location.href='index.html'">SHADOW CASINO</div>
        <div class="profile-menu">
            <span onclick="toggleDropdown()" id="menu-username">Benutzer</span>
            <div id="profile-dropdown" class="dropdown-content">
                <a href="admin.html" id="admin-panel-link" style="display:none; font-weight:bold; color:#00ffcc;">⚙️ Admin Panel</a>
                <a href="index.html">🏠 Zentrale</a>
                <a href="#" onclick="logout()">Abmelden</a>
            </div>
        </div>
    </div>

    <div class="game-container">
        <div style="font-size: 0.95rem; color: #aaa; margin-bottom: 15px;">Guthaben: <span id="balance" style="color:#00ffcc; font-weight:bold;">0</span> $</div>
        
        <div class="slot-machine">
            <div class="slots-grid">
                <div id="c0" class="slot-cell">🎰</div>
                <div id="c1" class="slot-cell">🎰</div>
                <div id="c2" class="slot-cell">🎰</div>
            </div>
            <button id="spin-btn" onclick="spin()">SPIN (20$)</button>
        </div>
        <div id="message" class="message">Triff 3 identische Symbole!</div>
    </div>
    <!-- =============== START BLOCK 4 =============== -->
    <script>
        const symbols = "🍒,🍋,🍇,🔔,💎,🍀,7️⃣".split(",");
        const winRates = { "🍒": 30, "🍋": 50, "🍇": 80, "🔔": 150, "💎": 300, "🍀": 500, "7️⃣": 1000 };
        let balance = 1000; let currentU = ""; let audioCtx = null;

        // Deine direkt verknüpften GitHub-Cloud-Daten
        const GH_USER = "Shadow13041"; 
        const GH_REPO = "Casino";
        const GH_TOKEN = "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"; 
        let currentFileSha = "";

                function getCryptoRandomSymbol() {
            let cryptoArray = new Uint32Array(1);
            window.crypto.getRandomValues(cryptoArray);
            let rawNumber = cryptoArray[0];
            
            // Casino-Gewichtung für eine spürbar höhere Trefferquote (ca. 40%)
            // Kirsche (🍒), Zitrone (🍋) und Traube (🍇) bekommen mehr Gewicht auf den Walzen
            let weightedPool = "🍒,🍒,🍒,🍋,🍋,🍇,🍇,🔔,💎,🍀,7️⃣".split(",");
            let randomIndex = rawNumber % weightedPool.length;
            return weightedPool[randomIndex];
        }



        function playSound(type) {
            try {
                if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'tick') { osc.type = 'triangle'; osc.frequency.setValueAtTime(500, audioCtx.currentTime); gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05); osc.start(); osc.stop(audioCtx.currentTime + 0.05); } 
                else if (type === 'win') { osc.type = 'square'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35); osc.start(); osc.stop(audioCtx.currentTime + 0.35); } 
                else if (type === 'lose') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(160, audioCtx.currentTime); gain.gain.setValueAtTime(0.12, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }
            } catch(e) {}
        }

        window.onload = function() {
            currentU = localStorage.getItem("sc_username"); if (!currentU) { location.href = "login.html"; return; }
            document.getElementById("menu-username").innerText = currentU;
            const currentRole = localStorage.getItem("sc_role");
            if (currentRole === "Owner" || currentRole === "Admin") { document.getElementById("admin-panel-link").style.display = "block"; }
            
            balance = parseInt(localStorage.getItem("sc_balance_" + currentU) || 1000);
            document.getElementById("balance").innerText = balance;
        };
                /* =============== START BLOCK 5 =============== */
                        async function syncFromCloud() {
            try {
                const res = await fetch("https://github.com" + GH_USER + "/" + GH_REPO + "/contents/users.json", { 
                    headers: { "Authorization": "token " + GH_TOKEN, "Accept": "application/vnd.github.v3+json" } 
                });
                if(res.ok) { 
                    const data = await res.json(); 
                    currentFileSha = data.sha; 
                    let text = decodeURIComponent(escape(atob(data.content))); 
                    localStorage.setItem("sc_global_users", text); 
                }
            } catch(e) {}
        }

        async function pushToCloud() {
            try {
                await syncFromCloud();
                let fallbackEmptyArray = String.fromCharCode(91) + String.fromCharCode(93);
                let userList = JSON.parse(localStorage.getItem("sc_global_users") || fallbackEmptyArray);
                let idx = userList.findIndex(u => u.username === currentU);
                if(idx !== -1) { 
                    userList.at(idx).balance = balance; 
                }
                let b64 = btoa(unescape(encodeURIComponent(JSON.stringify(userList))));
                await fetch("https://github.com" + GH_USER + "/" + GH_REPO + "/contents/users.json", { 
                    method: "PUT", 
                    headers: { "Authorization": "token " + GH_TOKEN, "Content-Type": "application/json" }, 
                    body: JSON.stringify({ message: "Casino-Cloud: Slots3x1-Update", content: b64, sha: currentFileSha }) 
                });
            } catch(e) {}
        }

        function toggleDropdown() { const drop = document.getElementById("profile-dropdown"); drop.style.display = drop.style.display === "block" ? "none" : "block"; }
        function logout() { localStorage.removeItem("sc_username"); localStorage.removeItem("sc_role"); localStorage.removeItem("sc_password"); location.href = "index.html"; }

        function spin() { 
            if (balance < 20) { alert("Pleite!"); return; } 
            balance -= 20; document.getElementById("balance").innerText = balance; 
            localStorage.setItem("sc_balance_" + currentU, balance); pushToCloud(); 
            document.getElementById("spin-btn").disabled = true;
            
            let cryptoArray = new Uint32Array(1);
            window.crypto.getRandomValues(cryptoArray);
            let winChanceRoll = (cryptoArray.at(0) % 100) + 1; 
            
            let finalS0, finalS1, finalS2;
            
            if (winChanceRoll <= 40) {
                let winSymPool = "🍒,🍒,🍒,🍋,🍋,🍇,🍇,🔔,💎,🍀,7️⃣".split(",");
                let symRoll = cryptoArray.at(0) % winSymPool.length;
                let guaranteedSymbol = winSymPool.at(symRoll);
                finalS0 = guaranteedSymbol; finalS1 = guaranteedSymbol; finalS2 = guaranteedSymbol;
            } else {
                let mainPool = "🍒,🍋,🍇,🔔,💎,🍀,7️⃣".split(",");
                finalS0 = mainPool.at(cryptoArray.at(0) % mainPool.length);
                
                let cryptoArray2 = new Uint32Array(2);
                window.crypto.getRandomValues(cryptoArray2);
                finalS1 = mainPool.at(cryptoArray2.at(0) % mainPool.length);
                finalS2 = mainPool.at(cryptoArray2.at(1) % mainPool.length);
            }
            
            let count = 0; 
            const interval = setInterval(() => { 
                let animationPool = "🍒,🍋,🍇,🔔,💎,🍀,7️⃣".split(",");
                let animArray = new Uint32Array(3);
                window.crypto.getRandomValues(animArray);
                
                document.getElementById("c0").innerText = animationPool.at(animArray.at(0) % animationPool.length);
                document.getElementById("c1").innerText = animationPool.at(animArray.at(1) % animationPool.length);
                document.getElementById("c2").innerText = animationPool.at(animArray.at(2) % animationPool.length);
                playSound("tick"); count++; 
                
                if (count > 8) { 
                    clearInterval(interval); 
                    document.getElementById("c0").innerText = finalS0;
                    document.getElementById("c1").innerText = finalS1;
                    document.getElementById("c2").innerText = finalS2;
                    determineResult(); 
                } 
            }, 120); 
        }

        function determineResult() {
            let s0 = document.getElementById("c0").innerText;
            let s1 = document.getElementById("c1").innerText;
            let s2 = document.getElementById("c2").innerText;
            
            if (s0 === s1 && s1 === s2) {
                let win = Reflect.get(winRates, s0); 
                balance += win;
                document.getElementById("message").innerText = "🎉 Mustertreffer! +" + win + "$";
                playSound("win");
            } else {
                document.getElementById("message").innerText = "❌ Kein Gewinn.";
                playSound("lose");
            }
            
            document.getElementById("balance").innerText = balance;
            localStorage.setItem("sc_balance_" + currentU, balance); pushToCloud();
            document.getElementById("spin-btn").disabled = false;
        }
    </script>
</body>
</html>
