<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Slots - Shadow Casino</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d11; color: #ffffff; text-align: center; padding: 20px; margin: 0;
        }
        .main-header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;
            position: absolute; top: 0; left: 0; right: 0; z-index: 100; background: rgba(13, 13, 17, 0.9);
        }
        .nav-logo {
            color: #ff0055; text-shadow: 0 0 10px #ff0055; font-size: 1.6rem; font-weight: bold;
            cursor: pointer; text-decoration: none; margin: 0;
        }
        .profile-menu {
            color: #555566; font-size: 0.95rem; cursor: pointer; text-align: right; position: relative;
        }
        .profile-menu:hover { color: #888899; }
        /* =============== ENDE BLOCK 1 / HIER BLOCK 2 ANFÜGEN =============== */
              /* =============== START BLOCK 2 =============== */
        .dropdown-content {
            display: none; background: #161622; border: 1px solid #333344; padding: 10px; border-radius: 10px;
            position: absolute; right: 0; top: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 120px; z-index: 200;
        }
        .dropdown-content a { color: #ff0055; text-decoration: none; display: block; margin: 5px 0; font-size: 0.85rem; }
        .game-container {
            background: #161622; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: inline-block; width: 90%; max-width: 420px; margin-top: 100px; text-align: center;
        }
        .stats-container {
            background: #0d0d11; border: 1px solid #222; display: inline-block; padding: 10px 20px; border-radius: 15px; margin-bottom: 20px;
        }
        .stats-text { font-size: 1rem; margin: 3px 0; color: #bbb; }
        .balance-value { color: #00ffcc; font-weight: bold; font-size: 1.2rem; }
        /* =============== ENDE BLOCK 2 / HIER BLOCK 3 ANFÜGEN =============== */
              /* =============== START BLOCK 3 =============== */
        .slot-machine {
            background: linear-gradient(145deg, #1e1e2f, #12121f); border: 4px solid #ff0055; border-radius: 25px;
            padding: 30px 20px; display: inline-block; box-shadow: 0 0 30px rgba(255, 0, 85, 0.25);
            margin-bottom: 10px; width: 95%; max-width: 380px;
        }
        .slots { display: flex; justify-content: center; gap: 12px; margin-bottom: 25px; }
        .slot {
            background: #05050a; width: 85px; height: 110px; line-height: 110px; font-size: 3.5rem;
            border-radius: 15px; border: 2px solid #333344; box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
        }
        button {
            background: linear-gradient(135deg, #ff0055, #bc003f); color: white; border: none; padding: 12px 30px;
            font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
        }
        button:disabled { background: #444; box-shadow: none; cursor: not-allowed; }
        .message { font-size: 1.1rem; height: 30px; color: #ffcc00; font-weight: bold; margin-top: 15px; }
        .streak-alert { font-size: 0.95rem; color: #ff9900; height: 20px; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="main-header">
        <div class="nav-logo" onclick="location.href='index.html'">SHADOW CASINO</div>
        <div class="profile-menu">
            <span onclick="toggleDropdown()" id="menu-username">Benutzer</span>
            <div id="profile-dropdown" class="dropdown-content">
                <a href="admin.html" id="admin-panel-link" style="display:none; font-weight:bold; color:#00ffcc;">⚙️ Admin Panel</a>
                <a href="index.html">🏠 Zentrale</a>
                <a href="#" onclick="logout()">Abmelden</a>
            </div>
        </div>
    </div>
        <!-- =============== ENDE BLOCK 3 / HIER BLOCK 4 ANFÜGEN =============== -->
  <!-- =============== START BLOCK 4 =============== -->
    <div class="game-container">
        <div class="stats-container">
            <div class="stats-text">Guthaben: <span id="balance" class="balance-value">1000</span> $</div>
            <div class="stats-text">Aktueller Streak: <span id="streak" style="color:#ff9900;font-weight:bold;">0</span> 🔥</div>
            <div class="stats-text">Top Streak: <span id="top-streak" style="color:#ffcc00;font-weight:bold;">0</span> 👑</div>
        </div>
        <br>
        <div class="slot-machine">
            <div class="slots">
                <div id="slot1" class="slot">🎰</div>
                <div id="slot2" class="slot">🎰</div>
                <div id="slot3" class="slot">🎰</div>
            </div>
            <button id="spin-btn" onclick="spin()">SPIN (50$)</button>
        </div>
        <div id="message" class="message">Klicke auf SPIN um dein Glück zu testen!</div>
        <div id="streak-alert" class="streak-alert"></div>
    </div>

    <script>
        const symbols = ['🍒', '🍋', '🍇', '🔔', '💎', '🍀', '7️⃣'];
        const winRates = { '🍒': 100, '🍋': 150, '🍇': 200, '🔔': 350, '💎': 500, '🍀': 750, '7️⃣': 2500 };
        let balance = 1000; let currentStreak = 0; let topStreak = 0; let currentU = ""; let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'tick') { osc.type = 'triangle'; osc.frequency.setValueAtTime(600, audioCtx.currentTime); gain.gain.setValueAtTime(0.08, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05); osc.start(); osc.stop(audioCtx.currentTime + 0.05); } 
                else if (type === 'win') { osc.type = 'square'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16); gain.gain.setValueAtTime(0.12, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4); osc.start(); osc.stop(audioCtx.currentTime + 0.4); } 
                else if (type === 'lose') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(90, audioCtx.currentTime + 0.3); gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35); osc.start(); osc.stop(audioCtx.currentTime + 0.35); }
            } catch(e) {}
        }
        /* =============== ENDE BLOCK 4 / HIER BLOCK 5 ANFÜGEN =============== */
              /* =============== START BLOCK 5 =============== */
        window.onload = function() {
            currentU = localStorage.getItem('sc_username'); if (!currentU) { location.href = 'index.html'; return; }
            document.getElementById('menu-username').innerText = currentU;
            const currentRole = localStorage.getItem('sc_role');
            if (currentRole === "Owner" || currentRole === "Admin") { document.getElementById('admin-panel-link').style.display = "block"; }
            
            balance = parseInt(localStorage.getItem('sc_balance_' + currentU) || 1000);
            topStreak = parseInt(localStorage.getItem('sc_top_streak_' + currentU) || 0);
            document.getElementById('balance').innerText = balance;
            document.getElementById('top-streak').innerText = topStreak;
        };

        async function pushToCloud() {
            try {
                let userList = JSON.parse(localStorage.getItem('sc_global_users') || '[]');
                userList.forEach(u => { u.balance = parseInt(localStorage.getItem('sc_balance_' + u.username) || 1000); });
                await fetch(`https://kvdb.io`, { method: 'PUT', body: JSON.stringify(userList) });
            } catch(e) {}
        }

        function toggleDropdown() { const drop = document.getElementById('profile-dropdown'); drop.style.display = drop.style.display === "block" ? "none" : "block"; }
        function logout() { localStorage.removeItem('sc_username'); localStorage.removeItem('sc_role'); localStorage.removeItem('sc_password'); location.href = 'index.html'; }

        function spin() { if (balance < 50) { alert("Pleite!"); return; } balance -= 50; document.getElementById('balance').innerText = balance; localStorage.setItem('sc_balance_' + currentU, balance); pushToCloud(); document.getElementById('spin-btn').disabled = true; let count = 0; const interval = setInterval(() => { document.getElementById('slot1').innerText = symbols[Math.floor(Math.random() * symbols.length)]; document.getElementById('slot2').innerText = symbols[Math.floor(Math.random() * symbols.length)]; document.getElementById('slot3').innerText = symbols[Math.floor(Math.random() * symbols.length)]; playSound('tick'); count++; if (count > 8) { clearInterval(interval); determineResult(); } }, 120); }
        function determineResult() {
            let s1, s2, s3; let luck = Math.random(); if (luck < 0.12) { s1 = symbols[Math.floor(Math.random() * symbols.length)]; s2 = s1; s3 = s1; } else if (luck < 0.38) { s1 = symbols[Math.floor(Math.random() * symbols.length)]; s2 = s1; do { s3 = symbols[Math.floor(Math.random() * symbols.length)]; } while (s3 === s1); } else { s1 = '🍒'; s2 = '🍋'; s3 = '🍇'; }
            document.getElementById('slot1').innerText = s1; document.getElementById('slot2').innerText = s2; document.getElementById('slot3').innerText = s3;
            if (s1 === s2 && s2 === s3) { let win = winRates[s1]; balance += win; currentStreak++; document.getElementById('message').innerText = `🎉 JACKPOT! 3x ${s1}! +${win}$`; } 
            else if (s1 === s2 || s2 === s3 || s1 === s3) { balance += 75; currentStreak++; document.getElementById('message').innerText = "💵 Gewinn! +75$"; } else { document.getElementById('message').innerText = "❌ Kein Gewinn."; currentStreak = 0; }
            if (currentStreak >= 3) { let bonus = 50 + ((currentStreak - 3) * 25); balance += bonus; document.getElementById('streak-alert').innerText = `🔥 STREAK-BONUS! +${bonus}$!`; }
            if (currentStreak > topStreak) { topStreak = currentStreak; localStorage.setItem('sc_top_streak_' + currentU, topStreak); }
            document.getElementById('streak').innerText = currentStreak; document.getElementById('balance').innerText = balance; localStorage.setItem('sc_balance_' + currentU, balance); pushToCloud(); document.getElementById('spin-btn').disabled = false;
        }
    </script>
</body>
</html>
